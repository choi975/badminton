<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>羽球助手</title>
  <style>
    :root {
      --bg: #f2f6f5;
      --panel: #ffffff;
      --panel-soft: #f7faf9;
      --line: #d9e2e0;
      --line-strong: #b8c6c3;
      --text: #172522;
      --muted: #61706d;
      --accent: #14786f;
      --accent-dark: #0b5d56;
      --accent-soft: #dff3ef;
      --focus: rgba(20, 120, 111, 0.16);
      --amber: #a35c00;
      --amber-soft: #fff1d6;
      --danger: #b42318;
      --shadow-soft: 0 2px 10px rgba(23, 37, 34, 0.06);
      --shadow: 0 24px 64px rgba(18, 38, 33, 0.2);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--text);
      min-height: 38px;
      border-radius: 6px;
      padding: 0 13px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, transform 0.08s ease;
    }

    button:hover {
      border-color: var(--accent);
      background: #f4faf8;
      color: var(--accent-dark);
    }

    button:active:not(:disabled) { transform: translateY(1px); }

    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 1px;
    }

    button:disabled { cursor: not-allowed; opacity: 0.48; }

    .app-shell {
      width: min(1580px, 100%);
      height: 100vh;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 14px;
    }

    .database-area {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 14px;
    }

    .database-area[hidden], .read-only-banner[hidden], .retry-connection-btn[hidden] {
      display: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow-soft);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 180px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--accent-dark);
      color: #fff;
      font-weight: 700;
      font-size: 20px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16), 0 3px 8px rgba(11, 93, 86, 0.18);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .sync-state {
      color: var(--muted);
      font-size: 12px;
      min-height: 16px;
      line-height: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .data-status-row {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .retry-connection-btn {
      width: 24px;
      min-width: 24px;
      min-height: 22px;
      padding: 0;
      border-color: transparent;
      background: transparent;
      color: var(--accent-dark);
      font-size: 15px;
      line-height: 1;
    }

    .sync-state::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: #8a9894;
      box-shadow: 0 0 0 3px rgba(138, 152, 148, 0.12);
    }

    .sync-state[data-state="success"]::before {
      background: #1a8b65;
      box-shadow: 0 0 0 3px rgba(26, 139, 101, 0.13);
    }

    .sync-state[data-state="working"]::before {
      background: #cc7a12;
      box-shadow: 0 0 0 3px rgba(204, 122, 18, 0.13);
    }

    .sync-state[data-state="error"] {
      color: var(--danger);
    }

    .sync-state[data-state="error"]::before {
      background: #d43b31;
      box-shadow: 0 0 0 3px rgba(212, 59, 49, 0.13);
    }

    .sync-state[data-state="readonly"] {
      color: var(--amber);
    }

    .sync-state[data-state="readonly"]::before {
      background: #cc7a12;
      box-shadow: 0 0 0 3px rgba(204, 122, 18, 0.13);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    .primary-btn {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 2px 6px rgba(20, 120, 111, 0.18);
    }

    .primary-btn:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
      color: #fff;
      box-shadow: 0 4px 10px rgba(11, 93, 86, 0.2);
    }

    .icon-text {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow-soft);
    }

    .read-only-banner {
      border: 1px solid #e8c58d;
      border-radius: 7px;
      padding: 9px 12px;
      background: #fff8e8;
      color: #744500;
      font-size: 13px;
      line-height: 1.45;
    }

    .read-only-value {
      color: var(--text);
      font-weight: 600;
    }

    .filterbar {
      display: grid;
      grid-template-columns: minmax(260px, 420px) 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 11px 12px;
    }

    .search-input, .filter-input, .filter-select, .modal input, .modal textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      min-height: 38px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease;
    }

    .search-input:focus, .filter-input:focus, .filter-select:focus, .modal input:focus, .modal textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus);
    }

    .search-input {
      background: #fbfdfc;
      font-size: 14px;
    }

    .search-input::placeholder { color: #879490; }

    .count-pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      min-width: 58px;
      padding: 6px 11px;
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      background: var(--accent-soft);
      border-color: #c8e6df;
    }

    .table-tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .column-menu-wrap {
      position: relative;
    }

    .column-visibility-btn {
      min-height: 34px;
      padding: 0 10px;
      background: #fbfdfc;
      color: #30413d;
      font-size: 13px;
    }

    .column-visibility-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 20;
      width: 184px;
      padding: 6px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(18, 38, 33, 0.16);
    }

    .column-visibility-menu[hidden] { display: none; }

    .column-visibility-option {
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 8px;
      border-radius: 5px;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .column-visibility-option:hover { background: var(--panel-soft); }

    .column-visibility-option input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .table-wrap {
      min-height: 0;
      overflow: auto;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow-soft);
      scrollbar-color: #b8c6c3 transparent;
    }

    table {
      width: 100%;
      min-width: 1180px;
      border-collapse: separate;
      border-spacing: 0;
    }

    th, td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fff;
      vertical-align: top;
      transition: background-color 0.12s ease;
    }

    th:last-child, td:last-child { border-right: 0; }
    tbody tr:last-child td { border-bottom: 0; }

    th {
      position: sticky;
      top: 0;
      z-index: 3;
      padding: 9px;
      background: #edf4f2;
      color: #30413d;
      text-align: left;
      font-size: 13px;
      font-weight: 700;
    }

    .header-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 28px;
    }

    .sort-btn {
      width: 32px;
      min-width: 32px;
      min-height: 30px;
      padding: 0;
      font-size: 14px;
      line-height: 1;
      background: rgba(255, 255, 255, 0.72);
    }

    .sort-btn.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-dark);
    }

    .filter-row {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
    }

    .filter-menu-wrap {
      position: relative;
      min-width: 0;
    }

    .multi-filter-btn {
      width: 100%;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 10px;
      background: #fff;
      color: var(--text);
      font-weight: 600;
      text-align: left;
    }

    .multi-filter-btn.active {
      border-color: var(--accent);
      background: #edf9f6;
      color: var(--accent-dark);
    }

    .multi-filter-btn::after {
      content: "▾";
      color: var(--muted);
      font-size: 12px;
    }

    .multi-filter-menu {
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      z-index: 35;
      width: min(190px, 80vw);
      max-height: 310px;
      overflow: auto;
      padding: 6px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(18, 38, 33, 0.16);
    }

    .multi-filter-menu[hidden] { display: none; }

    .multi-filter-clear {
      width: 100%;
      min-height: 30px;
      margin-bottom: 4px;
      padding: 0 8px;
      color: var(--accent-dark);
      font-size: 13px;
      text-align: left;
      background: var(--accent-soft);
      border-color: #c8e6df;
    }

    .multi-filter-option {
      min-height: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 7px;
      border-radius: 5px;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .multi-filter-option:hover { background: var(--panel-soft); }

    .multi-filter-option input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--accent);
    }

    td {
      height: 44px;
      padding: 0;
      font-size: 14px;
    }

    .cell {
      min-height: 44px;
      width: 100%;
      display: flex;
      align-items: center;
      padding: 9px 11px;
      outline: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    td.selected .cell {
      box-shadow: inset 0 0 0 2px var(--accent);
      background: #edf9f6;
    }

    tbody tr:nth-child(even) td { background: #fbfdfc; }
    tbody tr:hover td { background: #f4faf8; }
    tbody tr:hover td.selected { background: #edf9f6; }

    td.description-cell .cell {
      line-height: 1.58;
      color: #41514d;
      max-height: 150px;
      overflow: auto;
      align-items: flex-start;
    }

    td.notes-cell .cell {
      align-items: flex-start;
      line-height: 1.55;
      color: #41514d;
    }

    .notes-cell-content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 6px;
      width: 100%;
    }

    .notes-cell-content > span {
      white-space: pre-wrap;
      word-break: break-word;
      min-width: 0;
    }

    .notes-edit-textarea {
      width: 100%;
      min-height: 84px;
      border: 0;
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      padding: 8px 10px;
      background: #fff;
      font: inherit;
      line-height: 1.5;
      resize: vertical;
    }

    .photo-cell-content {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      justify-items: start;
      gap: 6px;
      width: 100%;
    }

    .photo-thumb {
      width: 46px;
      height: 46px;
      object-fit: cover;
      border-radius: 7px;
      border: 1px solid var(--line-strong);
      background: #eef3f1;
      cursor: zoom-in;
      display: block;
    }

    .photo-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .photo-action-btn {
      min-height: 22px;
      padding: 0 7px;
      font-size: 12px;
      border-radius: 5px;
      background: #fff;
      color: var(--accent-dark);
      border-color: #c8e6df;
      cursor: pointer;
    }

    .photo-action-btn:hover {
      background: var(--accent-soft);
    }

    .photo-download-link {
      font-size: 12px;
      color: var(--accent-dark);
    }

    .empty-hint { color: #98a2b3; }

    .name-cell-content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 28px;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .name-cell-content > span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .delete-member-btn {
      width: 24px;
      min-height: 24px;
      padding: 0;
      border-radius: 6px;
      color: #8c9a96;
      display: grid;
      place-items: center;
      font-size: 16px;
      line-height: 1;
      background: transparent;
      border-color: transparent;
    }

    .delete-member-btn:hover {
      border-color: #f04438;
      background: #fff1f0;
    }

    .edit-input {
      width: 100%;
      min-height: 44px;
      border: 0;
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      padding: 8px 10px;
      background: #fff;
    }

    .level-cell-content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 24px;
      align-items: stretch;
      gap: 4px;
      width: 100%;
    }

    .level-select, .affiliation-select {
      min-width: 0;
      width: 100%;
      height: 38px;
      padding: 0 8px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    .level-select:focus, .affiliation-select:focus {
      outline: 2px solid rgba(20, 132, 124, 0.24);
      border-color: var(--accent);
    }

    .join-number-cell-input {
      width: 100%;
      min-width: 0;
      height: 32px;
      padding: 0 6px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: var(--text);
      font: inherit;
      text-align: center;
    }

    .join-number-cell-input:hover {
      border-color: var(--line-strong);
      background: #fff;
    }

    .join-number-cell-input:focus {
      outline: 2px solid rgba(20, 132, 124, 0.24);
      border-color: var(--accent);
      background: #fff;
    }

    .level-buttons {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 2px;
      align-self: center;
    }

    .mini-btn {
      min-height: 17px;
      height: 17px;
      width: 22px;
      padding: 0;
      font-size: 10px;
      border-radius: 4px;
      display: grid;
      place-items: center;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(17, 30, 27, 0.52);
      z-index: 50;
      padding: 18px;
      backdrop-filter: blur(2px);
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(980px, 100%);
      max-height: min(88vh, 860px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.45);
    }

    .modal.wide { width: min(1360px, 100%); }
    .modal.medium { width: min(760px, 100%); }
    .modal.photo-dialog {
      width: min(760px, 100%);
    }

    a.primary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 0 13px;
      min-height: 38px;
      font-weight: 600;
      cursor: pointer;
      box-sizing: border-box;
    }

    a.primary-btn:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
      color: #fff;
    }

    .photo-body {
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 10px;
      background: #f6faf8;
    }

    .photo-body img {
      max-width: 100%;
      max-height: 72vh;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 4px 18px rgba(18, 38, 33, 0.18);
    }

    .modal.chain-dialog {
      width: min(1680px, calc(100vw - 16px));
      height: calc(100vh - 12px);
      max-height: calc(100vh - 12px);
    }

    .chain-dialog .modal-header { padding: 8px 16px; }

    .chain-dialog .modal-body {
      min-height: 0;
      overflow: hidden;
      padding: 10px;
    }
    .modal.guide-dialog {
      width: min(1360px, calc(100vw - 36px));
      height: min(86vh, 900px);
      max-height: calc(100vh - 36px);
    }

    .modal-header, .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .modal-footer {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      justify-content: flex-end;
      background: var(--panel-soft);
    }

    .modal-title {
      margin: 0;
      font-size: 18px;
      color: #20312d;
    }

    .modal-body {
      overflow: auto;
      padding: 16px;
      background: var(--panel-soft);
    }

    .modal-close-btn {
      width: 36px;
      min-width: 36px;
      min-height: 36px;
      padding: 0;
      border-color: transparent;
      background: transparent;
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
    }

    .modal-close-btn:hover {
      border-color: var(--line);
      background: #f1f5f4;
      color: var(--text);
    }

    .guide-body {
      display: grid;
      min-height: 0;
      overflow: hidden;
    }

    .guide-editor {
      width: 100%;
      height: 100%;
      min-height: 0;
      resize: none;
      line-height: 1.55;
      white-space: pre;
      padding: 14px;
      background: #fff;
    }

    .export-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: #fff;
      transition: border-color 0.16s ease, background-color 0.16s ease;
    }

    .check-item:hover { border-color: var(--accent); background: #f4faf8; }

    .check-item input { width: auto; min-height: auto; }

    .chain-grid {
      display: grid;
      grid-template-columns: minmax(250px, 0.9fr) minmax(430px, 1.25fr) minmax(260px, 0.72fr);
      gap: 10px;
      height: 100%;
      min-height: 0;
    }

    .chain-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
      background: #fff;
      box-shadow: 0 1px 4px rgba(23, 37, 34, 0.04);
    }

    .chain-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 7px 9px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      background: #edf4f2;
    }

    .chain-head-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chain-mode-btn {
      min-width: 82px;
      white-space: nowrap;
      background: #fff;
    }

    .chain-mode-btn.active {
      color: var(--accent);
      border-color: var(--accent);
      background: #ecf9f7;
    }

    .chain-textarea {
      border: 0;
      border-radius: 0;
      resize: none;

    .calendar-day.selected {
      border-color: var(--accent-dark);
      background: var(--accent-soft);
      box-shadow: 0 0 0 1px var(--accent-dark) inset;
    }

    .calendar-day-number {
      font-size: 13px;
      font-weight: 700;
    }

    .calendar-day-meta {
      position: absolute;
      top: 50%;
      left: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      max-width: calc(100% - 8px);
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .calendar-day-badge {
      overflow: hidden;
      color: var(--accent-dark);
      font-size: 18px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .calendar-day-venue {
      position: relative;
      left: 4px;
      flex: none;
      padding: 2px 4px;
      border: 1px solid currentColor;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.15;
      cursor: pointer;
      transition: filter 0.16s ease, transform 0.16s ease;
    }

    .calendar-day-venue:hover {
      filter: brightness(0.96);
    }

    .calendar-day-venue:active {
      transform: scale(0.96);
    }

    .calendar-day-venue:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .calendar-day-venue.venue-wenti {
      border-color: #d69b35;
      background: #fff4d7;
      color: #9a5b00;
    }

    .calendar-day-venue.venue-edc {
      border-color: #65a8dc;
      background: #e6f4ff;
      color: #17699f;
    }

    @media (max-width: 560px) {
      .calendar-day {
        min-height: 58px;
        padding-inline: 5px;
      }

      .calendar-day-meta {
        gap: 3px;
      }

      .calendar-day-badge {
        font-size: 15px;
      }

      .calendar-day-venue {
        left: 3px;
        padding-inline: 3px;
        font-size: 9px;
      }
    }

    .calendar-day-panel {
      padding-top: 12px;
      border-top: 1px dashed var(--line-strong);
    }

    .calendar-day-head {
      margin-bottom: 8px;
    }

    .calendar-day-head h3 {
      margin: 0;
      color: var(--text);
      font-size: 15px;
    }

    .calendar-day-records {
      display: grid;
      gap: 8px;
    }

    .empty-day-actions {
      display: grid;
      justify-items: start;
      gap: 8px;
    }

    .calendar-record {
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .calendar-record-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .calendar-record-meta {
      margin-top: 2px;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
    }

    .calendar-record-actions {
      display: flex;
      gap: 6px;
    }

    .calendar-record-actions button {
      min-height: 28px;
      padding: 0 9px;
      font-size: 12px;
    }

    .calendar-record-players {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 14px;
      font-size: 13px;
    }

    .calendar-record-player .plus {
      color: var(--muted);
    }

    .calendar-record-player .amount {
      color: var(--accent-dark);
      font-weight: 700;
    }

    @media (max-width: 700px) {
      .record-form-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .record-member-row {
        grid-template-columns: 1fr 1fr;
      }
      .record-member-plus {
        text-align: left;
      }
    }
  </style>

    async function loadBootstrap({ retry = false } = {}) {
      setSync(retry ? "正在重试连接" : "连接中");
      els.retryConnectionBtn.hidden = true;

      if (!IS_GITHUB_PAGES && !state.players.length) {
        const fallback = await loadFallbackBootstrap();
        if (fallback) applyBootstrapData(fallback.data, fallback.source, fallback.generatedAt);
      }

      if (IS_GITHUB_PAGES) {
        const fallback = await loadFallbackBootstrap();
        if (fallback) applyBootstrapData(fallback.data, fallback.source, fallback.generatedAt);
      }

      try {
        const data = await fetchCloudBootstrap();
        cacheBootstrap(data);
        applyBootstrapData(data, "cloud", new Date().toISOString());
      } catch (error) {
        if (!state.players.length) {
          const fallback = await loadFallbackBootstrap();
          if (fallback) applyBootstrapData(fallback.data, fallback.source, fallback.generatedAt);
        }
        if (!state.players.length) {
          state.readOnly = true;
          state.dataSource = "unavailable";
          setSync("数据加载失败", "error");
          els.retryConnectionBtn.hidden = false;
          applyReadOnlyUi();
          renderTable();
          toast(`数据加载失败：${error.message}`);
          return;
        }
        els.retryConnectionBtn.hidden = IS_GITHUB_PAGES;
        if (retry) toast("云端仍不可用，继续使用只读数据");
      }
    }

    async function fetchCloudBootstrap() {
      return api("/api/bootstrap", { method: "GET", timeout: 8000 });
    }

    async function loadFallbackBootstrap() {
      const cached = readCachedBootstrap();
      if (cached) return { data: cached.data, source: "cache", generatedAt: cached.savedAt || cached.generatedAt };
      try {
        const response = await fetch(SNAPSHOT_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const snapshot = await response.json();
        if (!snapshot?.data?.players) throw new Error("快照格式无效");
        return { data: snapshot.data, source: "snapshot", generatedAt: snapshot.generatedAt };
      } catch (error) {
        return null;
      }
    }

    function applyBootstrapData(data, source, generatedAt) {
      state.players = Array.isArray(data.players) ? data.players : [];
      state.sessions = normalizeSessions(data.sessions);
      state.levelDescriptions = data.levelDescriptions || {};
      state.levelGuideRaw = data.levelGuideRaw || "";
      state.estimator = normalizeEstimator(data.estimator);
      applyPaymentOrderState(data);
      state.dataSource = source;
      state.dataTimestamp = generatedAt || null;
      state.readOnly = IS_GITHUB_PAGES || source !== "cloud";
      applyReadOnlyUi();
      updateDataStatus();
      renderTable();
      if (els.calendarModal.classList.contains("open")) renderCalendar();
      if (els.chainModal.classList.contains("open")) processChain();
    }

    function cacheBootstrap(data) {
      try {
        localStorage.setItem(BOOTSTRAP_CACHE_KEY, JSON.stringify({ data, savedAt: new Date().toISOString() }));
      } catch (error) {
        // Storage can be unavailable in privacy modes; the bundled snapshot remains available.
      }
    }

    function readCachedBootstrap() {
      try {
        const cached = JSON.parse(localStorage.getItem(BOOTSTRAP_CACHE_KEY) || "null");
        return cached?.data?.players ? cached : null;
      } catch (error) {
        return null;
      }
    }

        return;
      }
      const timestamp = formatDataTimestamp(state.dataTimestamp);
      if (state.dataSource === "cache") setSync(`本地缓存（只读${timestamp ? `，${timestamp}` : ""}）`, "readonly");
      else if (state.dataSource === "snapshot") setSync(`内置快照（只读${timestamp ? `，${timestamp}` : ""}）`, "readonly");
    }

    function formatDataTimestamp(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return new Intl.DateTimeFormat("zh-CN", {
        year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false,
      }).format(date).replace(/\//g, "-");
    }

    function getApiUrl(path) {
      const normalizedPath = path.startsWith("/") ? path : `/${path}`;
      return IS_WORKER_APP ? normalizedPath : `${REMOTE_API_BASE}${normalizedPath}`;
    }

    async function api(path, options = {}) {
      const method = String(options.method || "GET").toUpperCase();
      if (state.readOnly && !["GET", "HEAD", "OPTIONS"].includes(method)) {
        throw new Error("当前为只读模式，不能修改数据库");
      }
      const headers = { ...(options.headers || {}) };
      const hasBody = options.body !== undefined && options.body !== null;
      const hasContentType = Object.keys(headers).some((key) => key.toLowerCase() === "content-type");
      if (hasBody && !hasContentType) headers["content-type"] = "text/plain; charset=utf-8";

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), options.timeout || 12000);
      const response = await fetch(getApiUrl(path), {
        ...options,
        headers,
        signal: options.signal || controller.signal,
      }).finally(() => clearTimeout(timeoutId));
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }

    function setSync(text, forcedState = "") {
      els.syncState.textContent = text;
      els.syncState.dataset.state = forcedState || (text.includes("失败")
        ? "error"
        : (text.includes("中") || text.includes("正在") || text.includes("打开") ? "working" : "success"));
    }

    function getVisibleColumns() {
      return COLUMNS
        .map((column, index) => ({ column, index }))
        .filter(({ column }) => !state.hiddenColumns.has(column.key));
    }

    function renderColumnVisibilityMenu() {
      const visibleCount = COLUMNS.length - state.hiddenColumns.size;
      const options = COLUMNS.map((column) => {
        const label = document.createElement("label");
        label.className = "column-visibility-option";
        label.setAttribute("role", "menuitemcheckbox");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = !state.hiddenColumns.has(column.key);
        checkbox.disabled = checkbox.checked && visibleCount === 1;
        checkbox.addEventListener("change", () => setColumnVisibility(column.key, checkbox.checked));

        const text = document.createElement("span");
        text.textContent = column.label;
        label.setAttribute("aria-checked", String(checkbox.checked));
        label.append(checkbox, text);
        return label;
      });
      els.columnVisibilityMenu.replaceChildren(...options);
    }

    function toggleColumnVisibilityMenu() {
      const opening = els.columnVisibilityMenu.hidden;
      els.columnVisibilityMenu.hidden = !opening;
      els.columnVisibilityBtn.setAttribute("aria-expanded", String(opening));
    }

    function closeColumnVisibilityMenu() {
      els.columnVisibilityMenu.hidden = true;
      els.columnVisibilityBtn.setAttribute("aria-expanded", "false");
    }

    function setColumnVisibility(key, visible) {
      if (visible) state.hiddenColumns.delete(key);
      else if (COLUMNS.length - state.hiddenColumns.size > 1) state.hiddenColumns.add(key);

      ensureSelectedColumnVisible();
      renderColumnVisibilityMenu();
      renderHeader();
      renderTable();
    }

    function ensureSelectedColumnVisible() {
      if (!state.hiddenColumns.has(COLUMNS[state.selected.col]?.key)) return;
      const visibleIndices = getVisibleColumns().map(({ index }) => index);
      state.selected.col = visibleIndices.reduce((closest, index) => (
        Math.abs(index - state.selected.col) < Math.abs(closest - state.selected.col) ? index : closest
      ), visibleIndices[0]);
    }

    function renderHeader() {
      const tr = document.createElement("tr");
      const visibleColumns = getVisibleColumns();
      const totalWidth = visibleColumns.reduce((sum, { column }) => sum + Number.parseFloat(column.width), 0);
      const tableWidth = visibleColumns.reduce((sum, { column }) => sum + (Number.parseFloat(column.width) / 100 * 1180), 0);
      els.playerTable.style.minWidth = `${Math.max(360, Math.round(tableWidth))}px`;

      visibleColumns.forEach(({ column }) => {
        const th = document.createElement("th");
        th.style.width = `${Number.parseFloat(column.width) / totalWidth * 100}%`;
        const headerLine = document.createElement("div");
        headerLine.className = "header-line";
        const label = document.createElement("span");
        label.textContent = column.label;
        headerLine.append(label);

        if (column.sortable) {
          const button = document.createElement("button");
          button.className = `sort-btn ${state.sort.key === column.key ? "active" : ""}`;
          button.title = "排序";
          button.textContent = getSortMark(column.key);
          button.addEventListener("click", () => cycleSort(column.key));
          headerLine.append(button);
        }

        th.append(headerLine);

        if (column.filter) {
          const filterRow = document.createElement("div");
          filterRow.className = "filter-row";
          if (column.filter === "text") {
            const input = document.createElement("input");
            input.className = "filter-input";
            input.placeholder = column.key === "name" ? "筛选（逗号分隔）" : "筛选";
            input.value = state.filters[column.key] || "";
            input.addEventListener("input", () => {
              state.filters[column.key] = input.value;
              renderTable();
            });
            filterRow.append(input);
          } else if (column.filter === "multi-enum") {
            filterRow.append(createMultiEnumFilter(column));
          } else {
            const select = document.createElement("select");
            select.className = "filter-select";
            select.innerHTML = `<option value="">全部</option>${column.options.map((option) => `<option value="${escapeHtml(option)}">${escapeHtml(option)}</option>`).join("")}`;
            select.value = state.filters[column.key] || "";
            select.addEventListener("change", () => {
              state.filters[column.key] = select.value;
              renderTable();
            });
            filterRow.append(select);
          }
          th.append(filterRow);
        }

        tr.append(th);
      });
      els.tableHead.replaceChildren(tr);
    }

    function createMultiEnumFilter(column) {
      const selected = new Set(Array.isArray(state.filters[column.key])
        ? state.filters[column.key]
        : (state.filters[column.key] ? [state.filters[column.key]] : []));
      const wrap = document.createElement("div");
      wrap.className = "filter-menu-wrap";

      const button = document.createElement("button");
      button.type = "button";
      button.className = `multi-filter-btn ${selected.size ? "active" : ""}`;
      button.textContent = getMultiFilterLabel(selected);
      button.title = "筛选中羽等级";
      button.setAttribute("aria-haspopup", "true");
      button.setAttribute("aria-expanded", "false");

      const menu = document.createElement("div");
      menu.className = "multi-filter-menu";
      menu.setAttribute("role", "menu");
      menu.hidden = true;

      const updateFilter = () => {
        if (selected.size) state.filters[column.key] = [...selected];
        else delete state.filters[column.key];
        button.textContent = getMultiFilterLabel(selected);
        button.classList.toggle("active", selected.size > 0);
        renderTable();
      };

      const clear = document.createElement("button");
      clear.type = "button";
      clear.className = "multi-filter-clear";
      clear.textContent = "全部等级";
      clear.addEventListener("click", () => {
        selected.clear();
        menu.querySelectorAll("input").forEach((input) => { input.checked = false; });
        updateFilter();
      });
      menu.append(clear);

      column.options.forEach((option) => {
        const label = document.createElement("label");
        label.className = "multi-filter-option";
        label.setAttribute("role", "menuitemcheckbox");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = option;
        checkbox.checked = selected.has(option);
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) selected.add(option);
          else selected.delete(option);
          label.setAttribute("aria-checked", String(checkbox.checked));
          updateFilter();
        });
        const text = document.createElement("span");
        text.textContent = option;
        label.setAttribute("aria-checked", String(checkbox.checked));
        label.append(checkbox, text);
        menu.append(label);
      });

      button.addEventListener("click", (event) => {
        event.stopPropagation();
        const opening = menu.hidden;
        closeMultiFilterMenus();
        menu.hidden = !opening;
        button.setAttribute("aria-expanded", String(opening));
      });
      wrap.append(button, menu);
      return wrap;
    }

    function getMultiFilterLabel(selected) {
      if (!selected.size) return "全部";
      const values = [...selected];
      return values.length <= 2 ? values.join("、") : `${values.slice(0, 2).join("、")}等${values.length}项`;
    }

    function closeMultiFilterMenus() {
      document.querySelectorAll(".multi-filter-menu").forEach((menu) => { menu.hidden = true; });
      document.querySelectorAll(".multi-filter-btn").forEach((button) => button.setAttribute("aria-expanded", "false"));
    }

    function getSortMark(key) {
      if (state.sort.key !== key) return "↕";
      return state.sort.dir === "asc" ? "↑" : "↓";
    }

    function cycleSort(key) {
      if (state.sort.key !== key) state.sort = { key, dir: "asc" };
      else if (state.sort.dir === "asc") state.sort = { key, dir: "desc" };
      else state.sort = { key: null, dir: "asc" };
      renderHeader();
      renderTable();
    }

    function renderTable() {
      ensureSelectedColumnVisible();
      const rows = getDisplayRows(!state.readOnly);
      if (!rows.some((row) => row.key === state.selected.rowKey)) {
        state.selected = { rowKey: rows[0]?.key || "", col: 0 };
      }

      const fragment = document.createDocumentFragment();
      rows.forEach((row) => {
        const tr = document.createElement("tr");
        tr.dataset.rowKey = row.key;
        getVisibleColumns().forEach(({ column, index: colIndex }) => {
          const td = document.createElement("td");
          td.dataset.rowKey = row.key;
          td.dataset.col = String(colIndex);
          if (column.key === "description") td.classList.add("description-cell");
          if (column.key === "photo") td.classList.add("photo-cell");
          if (column.key === "notes") td.classList.add("notes-cell");
          if (state.selected.rowKey === row.key && state.selected.col === colIndex) td.classList.add("selected");

          const cell = document.createElement("div");
          cell.className = "cell";
          cell.tabIndex = td.classList.contains("selected") ? 0 : -1;
          cell.append(renderCellContent(row.player, column, row.draft));
          td.append(cell);

          td.addEventListener("click", () => selectCell(row.key, colIndex));
          td.addEventListener("dblclick", () => handleCellDoubleClick(row.key, colIndex));
          tr.append(td);
        });
        fragment.append(tr);
      });

      els.tableBody.replaceChildren(fragment);
      const filteredCount = getDisplayRows(false).length;
      els.rowCount.textContent = `${filteredCount} / ${state.players.length}人`;
      focusSelectedCell();
    }

    function renderCellContent(player, column, isDraft) {
      const wrapper = document.createDocumentFragment();
      const value = getCellValue(player, column.key);

      if (state.readOnly) {
        const span = document.createElement("span");
        span.className = "read-only-value";
        span.textContent = value;
        wrapper.append(span);
        return wrapper;
      }

      if (column.key === "level") {
        const rowKey = isDraft ? "draft" : String(player.id);
        const box = document.createElement("div");
        box.className = "level-cell-content";
        const select = document.createElement("select");
        select.className = "level-select";
        select.title = "选择中羽等级";
        for (const level of LEVELS) {
          const option = document.createElement("option");
          option.value = level;
          option.textContent = level;
          select.append(option);
        }
        select.value = player.level || "不详";
        select.addEventListener("click", (event) => {
          event.stopPropagation();
          state.selected = { rowKey, col: 3 };
        });
        select.addEventListener("focus", () => {
          state.selected = { rowKey, col: 3 };
        });
        select.addEventListener("change", async (event) => {
          event.stopPropagation();
          state.selected = { rowKey, col: 3 };
          await saveCell(rowKey, "level", select.value);
        });
        box.append(select);

        const buttons = document.createElement("div");
        buttons.className = "level-buttons";
        const up = document.createElement("button");
        up.className = "mini-btn";
        up.title = "提高等级";
        up.textContent = "▲";
        up.addEventListener("click", (event) => {
          event.stopPropagation();
          selectCell(rowKey, 2);
          adjustLevel(rowKey, 1);
        });
        const down = document.createElement("button");
        down.className = "mini-btn";
        down.title = "降低等级";
        down.textContent = "▼";
        down.addEventListener("click", (event) => {
          event.stopPropagation();
          selectCell(rowKey, 2);
          adjustLevel(rowKey, -1);
        });
        buttons.append(up, down);
        box.append(buttons);
        wrapper.append(box);
        return wrapper;
      }

      if (column.key === "affiliation") {
        const rowKey = isDraft ? "draft" : String(player.id);
        const select = document.createElement("select");
        select.className = "affiliation-select";
        select.title = "选择所属群组";
        AFFILIATIONS.forEach((affiliation) => {
          const option = document.createElement("option");
          option.value = affiliation;
          option.textContent = affiliation;
          select.append(option);
        });
        select.value = player.affiliation || "球友";
        select.addEventListener("click", (event) => {
          event.stopPropagation();
          state.selected = { rowKey, col: COLUMNS.findIndex((item) => item.key === "affiliation") };
        });
        select.addEventListener("focus", () => {
          state.selected = { rowKey, col: COLUMNS.findIndex((item) => item.key === "affiliation") };
        });
        select.addEventListener("change", async (event) => {
          event.stopPropagation();
          state.selected = { rowKey, col: COLUMNS.findIndex((item) => item.key === "affiliation") };
          await saveCell(rowKey, "affiliation", select.value);
        });
        wrapper.append(select);
        return wrapper;
      }

      if (["friendsJoinNumber", "hytronikJoinNumber"].includes(column.key)) {
        const affiliation = column.key === "friendsJoinNumber" ? "球友" : "Hytronik";
        if (isDraft || !hasPlayerAffiliation(player, affiliation)) {
          wrapper.append(document.createTextNode(""));
          return wrapper;
        }

        const rowKey = String(player.id);
        const columnIndex = COLUMNS.findIndex((item) => item.key === column.key);
        const input = document.createElement("input");
        input.className = "join-number-cell-input";
        input.type = "number";
        input.min = "1";
        input.step = "1";
        input.inputMode = "numeric";
        input.value = String(value);
        input.title = `修改${affiliation}入群序号`;
        input.setAttribute("aria-label", `${firstName(player.name) || "成员"}的${affiliation}入群序号`);
        input.addEventListener("click", (event) => {
          event.stopPropagation();
          state.selected = { rowKey, col: columnIndex };
          input.select();
        });
        input.addEventListener("focus", () => {
          state.selected = { rowKey, col: columnIndex };
          input.select();
        });
        input.addEventListener("change", () => saveJoinNumberCell(rowKey, affiliation, input.value));
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            input.blur();
          }
          if (event.key === "Escape") {
            event.preventDefault();
            renderTable();
          }
        });
        wrapper.append(input);
        return wrapper;
      }

      if (column.key === "name") {
        const box = document.createElement("div");
        box.className = "name-cell-content";
        const span = document.createElement("span");
        if (!value) {
          span.className = "empty-hint";
          span.textContent = isDraft ? "新建人物" : "未命名";
        } else {
          span.textContent = value;
        }
        box.append(span);

        if (!isDraft) {
          const button = document.createElement("button");
          button.className = "delete-member-btn";
          button.type = "button";
          button.title = "删除成员";
          button.setAttribute("aria-label", `删除${firstName(player.name) || "成员"}`);
          button.textContent = "×";
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            deletePlayer(String(player.id));
          });
          box.append(button);
        }

        wrapper.append(box);
        return wrapper;
      }

      if (column.key === "photo") {
        const box = document.createElement("div");
        box.className = "photo-cell-content";
        if (player.id && player.photoKey) {
          const img = document.createElement("img");
          img.className = "photo-thumb";
          img.src = getPhotoUrl(player);
          img.alt = `${firstName(player.name) || "成员"}照片`;
          img.title = "查看大图";
          img.loading = "lazy";
          img.addEventListener("click", (event) => {
            event.stopPropagation();
            openPlayerPhoto(player);
          });
          box.append(img);
          if (state.readOnly) {
            const link = document.createElement("a");
            link.className = "photo-download-link";
            link.href = getPhotoUrl(player, { download: true });
            link.textContent = "下载原图";
            box.append(link);
          } else {
            const actions = document.createElement("div");
            actions.className = "photo-actions";
            actions.append(
              createCellActionButton("更换", () => triggerPhotoUpload(String(player.id))),
              createCellActionButton("下载", () => downloadPlayerPhoto(player)),
              createCellActionButton("删除", () => deletePlayerPhoto(player)),
            );
            box.append(actions);
          }
        } else {
          const hint = document.createElement("span");
          hint.className = "empty-hint";
          hint.textContent = isDraft ? "" : "暂无照片";
          box.append(hint);
          if (!state.readOnly && !isDraft) {
            box.append(createCellActionButton("上传照片", () => triggerPhotoUpload(String(player.id))));
          }
        }
        wrapper.append(box);
        return wrapper;
      }

      if (column.key === "notes") {
        const box = document.createElement("div");
        box.className = "notes-cell-content";
        if (!value) {
          const hint = document.createElement("span");
          hint.className = "empty-hint";
          hint.textContent = isDraft ? "" : "暂无备注";
          box.append(hint);
        } else {
          const span = document.createElement("span");
          span.textContent = value;
          box.append(span);
        }
        if (!state.readOnly && !isDraft) {
          box.append(createCellActionButton("编辑", () => startNotesEdit(rowKeyFor(player))));
        }
        wrapper.append(box);
        return wrapper;
      }

      const span = document.createElement("span");
      span.textContent = value;
      wrapper.append(span);
      return wrapper;
    }

    function getCellValue(player, key) {
      if (key === "description") return player.level === "不详" ? "" : (state.levelDescriptions[player.level] || "");
      if (key === "photo") return player.photoKey ? getPhotoUrl(player) : "";
      if (key === "friendsJoinNumber") return getJoinNumber(player.id, "球友") ?? "";
      if (key === "hytronikJoinNumber") return getJoinNumber(player.id, "Hytronik") ?? "";
      if (key === "playCount" || key === "guestCount" || key === "amountTotal") {
        const stats = getMemberStats(player.id);
        if (key === "playCount") return stats.playCount;
        if (key === "guestCount") return stats.guestCount;
        return formatMoney(stats.amountTotal);
      }
      return player[key] || "";
    }

    function rowKeyFor(player) {
      return player.id ? String(player.id) : "draft";
    }

    function getJoinNumber(playerId, affiliation) {
      if (!playerId) return null;
      const entry = (state.groupJoinNumbers[affiliation] || []).find((item) => Number(item.playerId) === Number(playerId));
      return Number.isInteger(entry?.joinNumber) ? entry.joinNumber : null;
    }

    function getPlayerAffiliations(playerOrValue) {
      const value = typeof playerOrValue === "string" ? playerOrValue : playerOrValue?.affiliation;
      return String(value || "球友").split(/[+、,，]/).map((item) => item.trim()).filter(Boolean);
    }

    function hasPlayerAffiliation(playerOrValue, affiliation) {
      return getPlayerAffiliations(playerOrValue).includes(affiliation);
    }

    function isSpecialPlayer(player) {
      return player?.affiliation === "特殊";
    }

    function getDisplayRows(includeDraft) {
      const searchTerms = splitSearchTerms(els.globalSearch.value);
      let rows = state.players
        .map((player) => ({ key: String(player.id), player, draft: false }))
        .filter((row) => passesSearch(row.player, searchTerms) && passesFilters(row.player));

      if (state.sort.key) rows = rows.sort((a, b) => compareRows(a.player, b.player, state.sort.key, state.sort.dir));
      if (includeDraft) rows.push({ key: "draft", player: state.draft, draft: true });
      return rows;
    }

    function splitSearchTerms(value) {
      return String(value || "")
        .split(/[,，]/)
        .map((part) => normalizeSearch(part))
        .filter(Boolean);
    }

    function passesSearch(player, searchTerms) {
      if (!searchTerms.length) return true;
      const values = COLUMNS
        .filter((column) => column.key !== "photo")
        .map((column) => getCellValue(player, column.key));
      const searchable = normalizeSearch(values.join("\n"));
      return searchTerms.some((term) => searchable.includes(term));
    }

    function passesFilters(player) {
      return COLUMNS.every((column) => {
        const filter = state.filters[column.key];
        if (!filter || !column.filter) return true;
        const value = getCellValue(player, column.key);
        if (column.filter === "enum") {
          if (column.key === "affiliation" && ["球友", "Hytronik"].includes(filter)) {
            return hasPlayerAffiliation(value, filter);
          }
          return value === filter;
        }
        if (column.filter === "multi-enum") {
          const selected = Array.isArray(filter) ? filter : [filter];
          return !selected.length || selected.includes(value);
        }
        const filterTerms = splitSearchTerms(filter);
        const searchable = normalizeSearch(value);
        return !filterTerms.length || filterTerms.some((term) => searchable.includes(term));
      });
    }

    function compareRows(a, b, key, dir) {
      let result;
      if (key === "level") result = levelRank(a.level) - levelRank(b.level);
      else if (key === "name") result = collator.compare(firstName(a.name), firstName(b.name));
      else if (["playCount", "guestCount", "amountTotal"].includes(key)) {
        result = Number(getCellValue(a, key)) - Number(getCellValue(b, key));
      }
      else if (["friendsJoinNumber", "hytronikJoinNumber"].includes(key)) {
        const affiliation = key === "friendsJoinNumber" ? "球友" : "Hytronik";
        const aNumber = getJoinNumber(a.id, affiliation);
        const bNumber = getJoinNumber(b.id, affiliation);
        if (aNumber === null && bNumber === null) return dir === "asc"
          ? collator.compare(firstName(a.name), firstName(b.name))
          : collator.compare(firstName(b.name), firstName(a.name));
        else if (aNumber === null) return 1;
        else if (bNumber === null) return -1;
        else result = aNumber - bNumber;
      }
      else result = collator.compare(String(getCellValue(a, key)), String(getCellValue(b, key)));
      return dir === "asc" ? result : -result;
    }

    function selectCell(rowKey, col) {
      state.selected = { rowKey, col: clamp(col, 0, COLUMNS.length - 1) };
      renderTable();
    }

    function focusSelectedCell() {
      requestAnimationFrame(() => {
        const cell = els.tableBody.querySelector("td.selected .cell");
        if (cell && !state.editing && !isTextControl(document.activeElement)) cell.focus({ preventScroll: true });
      });
    }

    function handleCellDoubleClick(rowKey, colIndex) {
      if (state.readOnly) return;
      const key = COLUMNS[colIndex].key;
      if (key === "name") startNameEdit(rowKey, "append");
      if (key === "notes") startNotesEdit(rowKey);
      if (["gender", "affiliation"].includes(key)) cycleCellValue(rowKey, key);
      if (key === "level") adjustLevel(rowKey, 1);
      if (key === "photo") {
        const player = getPlayerByKey(rowKey);
        if (player?.photoKey) openPlayerPhoto(player);
      }
    }

    function handleGlobalKeydown(event) {
      if (event.key === "Escape") {
        if (document.querySelector(".multi-filter-menu:not([hidden])")) {
          closeMultiFilterMenus();
          return;
        }
        if (!els.columnVisibilityMenu.hidden) {
          closeColumnVisibilityMenu();
          return;
        }
        closeTopModal();
        maybeCancelChainEditFlow();
        return;
      }
      if (event.altKey && event.key.toLowerCase() === "f") {
        event.preventDefault();
        els.globalSearch.focus();
        els.globalSearch.select();
        return;
      }
      if (isAnyModalOpen() || state.editing || isTextControl(document.activeElement)) return;

      if (state.readOnly) {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key) && !event.altKey) {
          event.preventDefault();
          moveSelection(event.key);
        }
        return;
      }

      if (event.altKey && event.key.toLowerCase() === "n") {
        event.preventDefault();
        if (state.hiddenColumns.delete("name")) {
          renderColumnVisibilityMenu();
          renderHeader();
        }
        state.selected = { rowKey: "draft", col: 0 };
        renderTable();
        startNameEdit("draft", "replace");
        return;
      }

      const { rowKey, col } = state.selected;
      const column = COLUMNS[col];
      if (!column) return;

      if (column.key === "name" && event.altKey && event.key === "ArrowRight") {
        event.preventDefault();
        startNameEdit(rowKey, "append");
        return;
      }
      if (column.key === "level" && event.altKey && ["ArrowUp", "ArrowDown"].includes(event.key)) {
        event.preventDefault();
        adjustLevel(rowKey, event.key === "ArrowUp" ? 1 : -1);
        return;
      }
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key) && !event.altKey) {
        event.preventDefault();
        moveSelection(event.key);
        return;
      }
      if (event.key === "Tab" && column.cycle) {
        event.preventDefault();
        cycleCellValue(rowKey, column.key);
        return;
      }
      if (column.key === "name" && (event.key === "Enter" || event.key === "F2")) {
        event.preventDefault();
        startNameEdit(rowKey, "append");
        return;
      }
      if (column.key === "notes" && (event.key === "Enter" || event.key === "F2")) {
        event.preventDefault();
        startNotesEdit(rowKey);
        return;
      }
      if (column.key === "name" && event.key === "Delete") {
        event.preventDefault();
        if (rowKey === "draft") saveCell(rowKey, "name", "");
        else deletePlayer(rowKey);
        return;
      }
      if (column.key === "name" && isPrintableKey(event)) {
        event.preventDefault();
        startNameEdit(rowKey, "replace", event.key);
      }
    }

    function moveSelection(key) {
      const rows = getDisplayRows(!state.readOnly);
      if (!rows.length) return;
      let rowIndex = rows.findIndex((row) => row.key === state.selected.rowKey);
      if (rowIndex < 0) rowIndex = 0;
      const visibleIndices = getVisibleColumns().map(({ index }) => index);
      let columnPosition = Math.max(0, visibleIndices.indexOf(state.selected.col));
      if (key === "ArrowUp") rowIndex = Math.max(0, rowIndex - 1);
      if (key === "ArrowDown") rowIndex = Math.min(rows.length - 1, rowIndex + 1);
      if (key === "ArrowLeft") columnPosition = Math.max(0, columnPosition - 1);
      if (key === "ArrowRight") columnPosition = Math.min(visibleIndices.length - 1, columnPosition + 1);
      state.selected = { rowKey: rows[rowIndex].key, col: visibleIndices[columnPosition] };
      renderTable();
    }

    function startNameEdit(rowKey, mode, initialText = "") {
      if (state.readOnly) return;
      const player = getPlayerByKey(rowKey);
      const td = els.tableBody.querySelector(`td[data-row-key="${cssEscape(rowKey)}"][data-col="0"]`);
      if (!td || !player) return;
      state.editing = { rowKey, col: 0 };

      const input = document.createElement("input");
      input.className = "edit-input";
      input.value = mode === "replace" ? initialText : (player.name || "");
      td.replaceChildren(input);
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);

      let done = false;
      const commit = async () => {
        if (done) return;
        done = true;
        state.editing = null;
        await saveCell(rowKey, "name", input.value.trim());
      };
      const cancel = () => {
        if (done) return;
        done = true;
        state.editing = null;
        renderTable();
      };

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          commit();
        }
        if (event.key === "Escape") {
          event.preventDefault();
          cancel();
        }
      });
      input.addEventListener("blur", commit);
    }

    function startNotesEdit(rowKey) {
      if (state.readOnly) return;
      const player = getPlayerByKey(rowKey);
      const columnIndex = COLUMNS.findIndex((column) => column.key === "notes");
      const td = els.tableBody.querySelector(`td[data-row-key="${cssEscape(rowKey)}"][data-col="${columnIndex}"]`);
      if (!td || !player || rowKey === "draft") return;
      state.editing = { rowKey, col: columnIndex };

      const textarea = document.createElement("textarea");
      textarea.className = "notes-edit-textarea";
      textarea.value = player.notes || "";
      td.replaceChildren(textarea);
      textarea.focus();
      textarea.setSelectionRange(textarea.value.length, textarea.value.length);

      let done = false;
      const commit = async () => {
        if (done) return;
        done = true;
        state.editing = null;
        await saveCell(rowKey, "notes", textarea.value.trim());
      };
      const cancel = () => {
        if (done) return;
        done = true;
        state.editing = null;
        renderTable();
      };

      textarea.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          commit();
        }
        if (event.key === "Escape") {
          event.preventDefault();
          cancel();
        }
      });
      textarea.addEventListener("blur", commit);
    }

    function getPhotoUrl(player, { download = false } = {}) {
      if (!player?.id || !player.photoKey) return "";
      const path = `/api/players/${player.id}/photo${download ? "?download=1" : ""}`;
      return getApiUrl(path);
    }

    function createCellActionButton(label, handler) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "photo-action-btn";
      button.textContent = label;
      button.addEventListener("click", (event) => {
        event.stopPropagation();
        handler();
      });
      return button;
    }

    function triggerPhotoUpload(playerId) {
      if (state.readOnly) return;
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/*";
      input.style.display = "none";
      document.body.append(input);
      input.addEventListener("change", async () => {
        const file = input.files?.[0];
        input.remove();
        if (!file) return;
        await uploadPlayerPhoto(playerId, file);
      });
      input.click();
    }

    async function uploadPlayerPhoto(playerId, file) {
      if (state.readOnly) {
        toast("当前为只读模式，不能修改照片");
        return;
      }
      if (!file.type.startsWith("image/")) {
        toast("请选择图片文件");
        return;
      }

    async function cycleCellValue(rowKey, key) {
      if (state.readOnly) return;
      const column = COLUMNS.find((item) => item.key === key);
      const player = getPlayerByKey(rowKey);
      if (!column?.cycle || !player) return;
      const currentIndex = column.cycle.indexOf(player[key]);
      const next = column.cycle[(currentIndex + 1) % column.cycle.length];
      await saveCell(rowKey, key, next);
    }

    async function adjustLevel(rowKey, delta) {
      if (state.readOnly) return;
      const player = getPlayerByKey(rowKey);
      if (!player) return;
      const index = Math.max(0, LEVELS.indexOf(player.level));
      const nextIndex = clamp(index + delta, 0, LEVELS.length - 1);
      if (nextIndex === index) return;
      await saveCell(rowKey, "level", LEVELS[nextIndex]);
    }

    async function saveCell(rowKey, key, value) {
      if (state.readOnly) {
        toast("当前为只读模式，不能修改数据库");
        return;
      }
      const player = getPlayerByKey(rowKey);
      if (!player) return;

      if (rowKey === "draft") {
        state.draft = { ...state.draft, [key]: value };
        if (!state.draft.name.trim()) {
          renderTable();
          return;
        }
        await createPlayerFromDraft();
        return;
      }

      if (player[key] === value) {
        renderTable();
        return;
      }

      const previous = { ...player };
      Object.assign(player, { [key]: value });
      renderTable();
      setSync("正在保存");
      try {
        const data = await api(`/api/players/${player.id}`, {
          method: "PATCH",
          body: JSON.stringify({ [key]: value }),
        });
        applyPaymentOrderState(data);
        replacePlayer(data.player);
        setSync("已保存");
      } catch (error) {
        replacePlayer(previous);
        setSync("保存失败");
        toast(`保存失败：${error.message}`);
      }
      renderTable();
    }

    async function saveJoinNumberCell(rowKey, affiliation, rawValue) {

        toast("当前为只读模式，不能修改数据库");
        return;
      }
      const player = getPlayerByKey(rowKey);
      const joinNumber = Number(rawValue);
      const current = getJoinNumber(player?.id, affiliation);

      if (!Number.isInteger(joinNumber) || joinNumber <= 0) {
        toast("入群序号需要填写大于0的整数");

        return;
      }
      if (current === joinNumber) {
        renderTable();
        return;
      }

      setSync("正在保存序号");
      try {
        const data = await api(`/api/players/${player.id}/join-numbers`, {
          method: "PATCH",

        });
        applyPaymentOrderState(data);
        setSync("已保存");
        if (els.paymentModal.classList.contains("open")) openPaymentModal();
      } catch (error) {
        setSync("保存失败");
        toast(`保存入群序号失败：${error.message}`);
      }
      renderTable();
    }

    async function createPlayerFromDraft() {
      if (state.readOnly) return;
      const draft = { ...state.draft, name: state.draft.name.trim() };
      state.draft = { ...DEFAULT_DRAFT };

    async function deletePlayer(rowKey) {
      if (state.readOnly) {
        toast("当前为只读模式，不能删除成员");
        return;
      }
      const player = getPlayerByKey(rowKey);
