    function exportXlsx() {
      const selectedKeys = [...els.exportOptions.querySelectorAll("input:checked")].map((input) => input.value);
      if (!selectedKeys.length) {
        toast("至少选择一列");
        return;
      }
      const selectedColumns = COLUMNS.filter((column) => selectedKeys.includes(column.key));
      const rows = [selectedColumns.map((column) => column.label)];
      for (const row of getDisplayRows(false)) rows.push(selectedColumns.map((column) => getCellValue(row.player, column.key)));
      const blob = new Blob([createXlsx(rows)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `中羽等级-${new Date().toISOString().slice(0, 10)}.xlsx`;
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
      closeModal("exportModal");
    }

    function createXlsx(rows) {
      const sheetRows = rows.map((row, rowIndex) => {
        const cells = row.map((value, colIndex) => {
          const ref = `${columnLetter(colIndex + 1)}${rowIndex + 1}`;
          return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${escapeXml(String(value ?? ""))}</t></is></c>`;
        }).join("");
        return `<row r="${rowIndex + 1}">${cells}</row>`;
      }).join("");
      const colCount = Math.max(1, rows[0]?.length || 1);
      const rowCount = Math.max(1, rows.length);
      const dimension = `A1:${columnLetter(colCount)}${rowCount}`;
      const worksheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><dimension ref="${dimension}"/><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="18"/><sheetData>${sheetRows}</sheetData></worksheet>`;

      const files = [
        { name: "[Content_Types].xml", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>` },
        { name: "_rels/.rels", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
        { name: "xl/workbook.xml", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="中羽等级" sheetId="1" r:id="rId1"/></sheets></workbook>` },
        { name: "xl/_rels/workbook.xml.rels", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>` },
        { name: "xl/worksheets/sheet1.xml", content: worksheet },
      ];
      return zipStore(files);
    }

    function zipStore(files) {
      const encoder = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      let offset = 0;
      const { dosTime, dosDate } = getDosTimeDate(new Date());

      for (const file of files) {
        const nameBytes = encoder.encode(file.name);
        const data = encoder.encode(file.content);
        const crc = crc32(data);
        const local = new Uint8Array(30 + nameBytes.length);
        const localView = new DataView(local.buffer);
        localView.setUint32(0, 0x04034b50, true);
        localView.setUint16(4, 20, true);
        localView.setUint16(6, 0x0800, true);
        localView.setUint16(8, 0, true);
        localView.setUint16(10, dosTime, true);
        localView.setUint16(12, dosDate, true);
        localView.setUint32(14, crc, true);
        localView.setUint32(18, data.length, true);
        localView.setUint32(22, data.length, true);
        localView.setUint16(26, nameBytes.length, true);
        local.set(nameBytes, 30);
        localParts.push(local, data);

        const central = new Uint8Array(46 + nameBytes.length);
        const centralView = new DataView(central.buffer);
        centralView.setUint32(0, 0x02014b50, true);
        centralView.setUint16(4, 20, true);
        centralView.setUint16(6, 20, true);
        centralView.setUint16(8, 0x0800, true);
        centralView.setUint16(10, 0, true);
        centralView.setUint16(12, dosTime, true);
        centralView.setUint16(14, dosDate, true);
        centralView.setUint32(16, crc, true);
        centralView.setUint32(20, data.length, true);
        centralView.setUint32(24, data.length, true);
        centralView.setUint16(28, nameBytes.length, true);
        centralView.setUint32(42, offset, true);
        central.set(nameBytes, 46);
        centralParts.push(central);
        offset += local.length + data.length;
      }

      const centralOffset = offset;
      const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
      const end = new Uint8Array(22);
      const endView = new DataView(end.buffer);
      endView.setUint32(0, 0x06054b50, true);
      endView.setUint16(8, files.length, true);
      endView.setUint16(10, files.length, true);
      endView.setUint32(12, centralSize, true);
      endView.setUint32(16, centralOffset, true);
      return concatUint8([...localParts, ...centralParts, end]);
    }

    function processChain() {
      const aliasIndex = buildAliasIndex();
      const identityCounts = new Map();
      const entries = getChainInputLines(els.chainInput.value)
        .map((line, index) => {
          const identity = normalizeAlias(cleanChainLine(line));
          const occurrence = identityCounts.get(identity) || 0;
          identityCounts.set(identity, occurrence + 1);
          const overrideKey = `${identity}::${occurrence}`;
          return parseChainLine(line, index, aliasIndex, overrideKey, state.plusOverrides[overrideKey]);
        })
        .filter((entry) => entry.clean);
      const activePlusKeys = new Set(entries.filter((entry) => entry.plusEntry).map((entry) => entry.overrideKey));
      Object.keys(state.plusOverrides).forEach((key) => {
        if (!activePlusKeys.has(key)) delete state.plusOverrides[key];
      });
      const sorted = [...entries].sort((a, b) => (b.sortRank - a.sortRank) || (a.index - b.index));
      state.chainOutputText = sorted.map((entry, index) => formatChainOutputLine(entry, index)).join("\n");
      renderChainOutput(sorted);
      renderChainStats(sorted);
      state.chainEntries = entries;
      updatePaymentButton();
    }

    function toggleChainLevelMode() {
      state.chainLevelMode = state.chainLevelMode === "exact" ? "group" : "exact";
      renderChainLevelModeButton();
      processChain();
    }

    function renderChainLevelModeButton() {
      const grouped = state.chainLevelMode === "group";
      els.levelDisplayModeBtn.textContent = grouped ? "⇄ 分组" : "⇄ 等级";
      els.levelDisplayModeBtn.classList.toggle("active", grouped);
      els.levelDisplayModeBtn.setAttribute("aria-pressed", String(grouped));
      els.levelDisplayModeBtn.title = grouped
        ? "当前为分组显示，点击切换为精确等级"
        : "当前为精确等级，点击切换为分组显示";
    }

    function getChainLevelDisplay(entry) {
      return state.chainLevelMode === "group"
        ? (entry.levelGroupLabel || getLevelGroupLabel(entry.levelText))
        : entry.levelText;
    }

    function getLevelGroupLabel(level) {
      if (!level || level === "不详" || level === "等级不详") return "不详";
      const rank = levelRank(level);
      if (rank >= 0.5 && rank <= 2) return "新手";
      if (rank >= 2.5 && rank <= 3.5) return "中手";
      if (rank >= 4 && rank <= 5) return "高手";
      if (rank >= 6 && rank <= 9) return "比赛级高手";
      return "不详";
    }

    function parseChainLine(line, index, aliasIndex, overrideKey = "", override = null) {
      const plusMetadata = parsePlusEntryMetadata(cleanChainLine(line));
      const clean = plusMetadata.displayName;
      const player = findPlayerForLine(clean, aliasIndex);
      const knownLevel = player?.level || "不详";
      const detectedLevelText = plusMetadata.plusEntry ? plusMetadata.levelText : knownLevel;
      const detectedIsFemale = plusMetadata.plusEntry ? plusMetadata.isFemale : player?.gender === "女";
      const levelText = plusMetadata.plusEntry && override?.levelText ? override.levelText : detectedLevelText;
      const detectedLevelGroupLabel = plusMetadata.plusEntry ? plusMetadata.levelGroupLabel : null;
      const levelGroupLabel = plusMetadata.plusEntry && override?.levelGroupLabel
        ? override.levelGroupLabel
        : detectedLevelGroupLabel;
      const isFemale = plusMetadata.plusEntry && typeof override?.isFemale === "boolean" ? override.isFemale : detectedIsFemale;
      return {
        index,
        raw: line,
        clean,
        player,
        plusEntry: plusMetadata.plusEntry,
        overrideKey,
        detectedLevelText,
        detectedLevelGroupLabel,
        detectedIsFemale,
        levelText,
        levelGroupLabel,
        isFemale,
        sortRank: levelRank(levelText),
      };
    }

    function getChainEntryBaseName(entry) {
      const name = String(entry?.clean || "");
      return entry?.plusEntry ? name.replace(/🌸/g, " ").replace(/\s+/g, " ").trim() : name;
    }

    function getChainEntryDisplayName(entry) {
      const name = getChainEntryBaseName(entry);
      if (!entry?.isFemale || name.includes("🌸")) return name;
      return `${name}🌸`;
    }

    function formatChainOutputLine(entry, index) {
      return `${index + 1}. ${getChainEntryDisplayName(entry)}（${getChainLevelDisplay(entry)}）`;
    }

    function renderChainOutput(entries) {
      els.chainOutput.replaceChildren(...entries.map((entry, index) => {
        const row = document.createElement("div");
        row.className = "chain-output-row";
        row.setAttribute("role", "listitem");

        const text = document.createElement("span");
        text.className = "chain-output-text";
        text.textContent = formatChainOutputLine(entry, index);
        row.append(text);

        if (entry.plusEntry) row.append(createInlinePlusControls(entry));
        return row;
      }));
    }

    function createInlinePlusControls(entry) {
      const controls = document.createElement("div");
      controls.className = "inline-plus-controls";

      const genderChoice = document.createElement("div");
      genderChoice.className = "inline-gender-choice";
      genderChoice.setAttribute("role", "group");
      genderChoice.setAttribute("aria-label", `${getChainEntryBaseName(entry)}的性别`);

      const maleButton = document.createElement("button");
      maleButton.type = "button";
      maleButton.textContent = "男";
      maleButton.classList.toggle("active", !entry.isFemale);
      maleButton.setAttribute("aria-pressed", String(!entry.isFemale));
      maleButton.addEventListener("click", () => setInlinePlusGender(entry.overrideKey, false));

      const femaleButton = document.createElement("button");
      femaleButton.type = "button";
      femaleButton.textContent = "女🌸";
      femaleButton.classList.toggle("active", entry.isFemale);
      femaleButton.setAttribute("aria-pressed", String(entry.isFemale));
      femaleButton.addEventListener("click", () => setInlinePlusGender(entry.overrideKey, true));
      genderChoice.append(maleButton, femaleButton);

      const levelSelect = document.createElement("select");
      levelSelect.className = "inline-level-select";
      levelSelect.setAttribute("aria-label", `${getChainEntryBaseName(entry)}的水平`);
      levelSelect.replaceChildren(...PLUS_LEVEL_OPTIONS.map((option) => {
        const element = document.createElement("option");
        element.value = option.label;
        element.textContent = option.text;
        return element;
      }));
      levelSelect.value = getInlinePlusLevelLabel(entry);
      levelSelect.addEventListener("change", () => setInlinePlusLevel(entry.overrideKey, levelSelect.value));

      controls.append(genderChoice, levelSelect);
      return controls;
    }

    function getInlinePlusLevelLabel(entry) {
      if (entry.levelGroupLabel && PLUS_LEVEL_OPTIONS.some((option) => option.label === entry.levelGroupLabel)) {
        return entry.levelGroupLabel;
      }
      const exactMatch = PLUS_LEVEL_OPTIONS.find((option) => option.level === entry.levelText);
      return exactMatch?.label || getLevelGroupLabel(entry.levelText);
    }

    function setInlinePlusGender(overrideKey, isFemale) {
      const entry = state.chainEntries.find((item) => item.overrideKey === overrideKey);
      if (!entry) return;
      state.plusOverrides[overrideKey] = {
        levelText: entry.levelText,
        levelGroupLabel: entry.levelGroupLabel,
        isFemale,
      };
      processChain();
    }

    function setInlinePlusLevel(overrideKey, label) {
      const entry = state.chainEntries.find((item) => item.overrideKey === overrideKey);
      const option = PLUS_LEVEL_OPTIONS.find((item) => item.label === label);
      if (!entry || !option) return;
      state.plusOverrides[overrideKey] = {
        levelText: option.level,
        levelGroupLabel: option.label,
        isFemale: entry.isFemale,
      };
      processChain();
    }

    function parsePlusEntryMetadata(value) {
      const displayName = String(value || "");
      const plusMatch = displayName.match(/[+＋➕]\s*\d+/);
      if (!plusMatch) return { plusEntry: false, displayName, levelText: null, isFemale: false };

      const suffixStart = (plusMatch.index || 0) + plusMatch[0].length;
      const suffix = displayName.slice(suffixStart);
      const levelMapping = PLUS_LEVEL_LABELS.find(([label]) => suffix.includes(label));
      let cleanedDisplayName = displayName;

      if (levelMapping) {
        const labelIndex = suffix.indexOf(levelMapping[0]);
        const absoluteIndex = suffixStart + labelIndex;
        cleanedDisplayName = `${displayName.slice(0, absoluteIndex)}${displayName.slice(absoluteIndex + levelMapping[0].length)}`.trim();
      }

      return {
        plusEntry: true,
        displayName: cleanedDisplayName,
        levelText: levelMapping?.[1] || "不详",
        levelGroupLabel: levelMapping?.[0] || "不详",
        isFemale: suffix.includes("🌸"),
      };
    }

    function renderChainStats(entries) {
      if (!entries.length) {
        els.chainStats.replaceChildren();
        return;
      }

      const levelLines = state.chainLevelMode === "group"
        ? buildGroupedLevelStats(entries)
        : buildExactLevelStats(entries);
      const femaleCount = entries.filter((entry) => entry.isFemale).length;

      const levelStats = document.createElement("div");
      levelStats.textContent = levelLines.join("\n");

      const divider = document.createElement("div");
      divider.className = "stats-divider";
      divider.setAttribute("role", "separator");

      const genderStats = document.createElement("div");
      genderStats.textContent = `女生：${femaleCount}人`;

      els.chainStats.replaceChildren(levelStats, divider, genderStats);
    }

    function buildExactLevelStats(entries) {
      const counts = new Map();
      for (const entry of entries) counts.set(entry.levelText, (counts.get(entry.levelText) || 0) + 1);
      return [...counts.entries()]
        .sort((a, b) => (levelRank(b[0]) - levelRank(a[0])) || collator.compare(a[0], b[0]))
        .map(([level, count]) => `${level === "不详" ? "等级不详" : level}：${count}人`);
    }

    function buildGroupedLevelStats(entries) {
      const counts = new Map();
      for (const entry of entries) {
        const group = entry.levelGroupLabel || getLevelGroupLabel(entry.levelText);
        counts.set(group, (counts.get(group) || 0) + 1);
      }
      return ["比赛级高手", "高手", "中手", "新手", "不详"]
        .filter((group) => counts.has(group))
        .map((group) => `${group}：${counts.get(group)}人`);
    }

    function updatePaymentButton() {
      const ready = Boolean(
        els.chainInput.value.trim() &&
        els.courtFeeInput.value.trim() &&
        els.shuttlePriceInput.value.trim() &&
        els.shuttleCountInput.value.trim()
      );
      els.paymentBtn.disabled = !ready;
    }

    function openPaymentModal() {
      processChain();
      const courtFee = Number(els.courtFeeInput.value);
      const shuttlePrice = Number(els.shuttlePriceInput.value);
      const shuttleCount = Number(els.shuttleCountInput.value);
      if (![courtFee, shuttlePrice, shuttleCount].every(Number.isFinite)) {
        toast("费用和球数需要填写数字");
        return;
      }
      const result = calculatePayment(state.chainEntries, courtFee, shuttlePrice, shuttleCount);
      renderPaymentGroup(els.paymentFriends, result.groups.friends, {
        showTotal: true,
        femaleCapApplied: result.femaleCapApplied,
      });
      renderPaymentGroup(els.paymentHeineken, result.groups.heineken, {
        showTotal: true,
        femaleCapApplied: result.femaleCapApplied,
      });
      renderPaymentGroup(els.paymentSpecial, result.groups.special, {
        showTotal: false,
        femaleCapApplied: result.femaleCapApplied,
      });
      els.paymentFriendsCard.hidden = result.groups.friends.length === 0;
      els.paymentHeinekenCard.hidden = result.groups.heineken.length === 0;
      const visibleGroupCount = 1 + Number(!els.paymentFriendsCard.hidden) + Number(!els.paymentHeinekenCard.hidden);
      els.paymentDialog.dataset.groupCount = String(visibleGroupCount);
      els.paymentReport.dataset.groupCount = String(visibleGroupCount);
      els.paymentCourtFee.textContent = formatCompactNumber(courtFee);
      els.paymentShuttlePrice.textContent = formatCompactNumber(shuttlePrice);
      els.paymentShuttleCount.textContent = formatCompactNumber(shuttleCount);
      openModal("paymentModal");
    }

    async function copyPaymentScreenshot() {
      if (typeof window.html2canvas !== "function") {
        toast("截图组件加载失败，请刷新页面后重试");
        return;
      }

      const originalText = els.paymentCaptureBtn.textContent;
      els.paymentCaptureBtn.disabled = true;
      els.paymentCaptureBtn.textContent = "正在截图";

      try {
        if (document.fonts?.ready) await document.fonts.ready;
        const blobPromise = window.html2canvas(els.paymentReport, {
          backgroundColor: "#f7faf9",
          logging: false,
          scale: Math.max(2, Math.min(3, window.devicePixelRatio || 1)),
          useCORS: true,
        }).then((canvas) => new Promise((resolve, reject) => {
          canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("生成图片失败")), "image/png");
        }));

        if (navigator.clipboard?.write && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": blobPromise })]);
          toast("群收款截图已复制");
        } else {
          downloadPaymentScreenshot(await blobPromise);
          toast("浏览器不支持复制图片，已改为下载");
        }
      } catch (error) {
        toast(`复制截图失败：${error.message}`);
      } finally {
        els.paymentCaptureBtn.disabled = false;
        els.paymentCaptureBtn.textContent = originalText;
      }
    }

    function downloadPaymentScreenshot(blob) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `群收款-${new Date().toISOString().slice(0, 10)}.png`;
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function openPaymentSettingsModal() {
      state.paymentSettingsEditor = {
        activeTab: "球友",
        orders: Object.fromEntries(PAYMENT_ORDER_AFFILIATIONS.map((affiliation) => [
          affiliation,
          getPlayersForOrder(affiliation).map((player) => Number(player.id)),
        ])),
        special: Object.fromEntries(
          state.players
            .filter(isSpecialPlayer)
            .map((player) => [String(player.id), player.participatesPayment !== false])
        ),
        draggingId: null,
      };
      renderPaymentSettings();
      openModal("paymentSettingsModal");
    }

    function switchPaymentSettingsTab(tab) {
      if (![...PAYMENT_ORDER_AFFILIATIONS, "特殊"].includes(tab)) return;
      state.paymentSettingsEditor.activeTab = tab;
      state.paymentSettingsEditor.draggingId = null;
      renderPaymentSettings();
    }

    function renderPaymentSettings() {
      const activeTab = state.paymentSettingsEditor.activeTab;
      const isSpecial = activeTab === "特殊";
      els.paymentSettingsTabs.forEach((tab) => {
        const active = tab.dataset.paymentSettingsTab === activeTab;
        tab.classList.toggle("active", active);
        tab.setAttribute("aria-selected", String(active));
        tab.tabIndex = active ? 0 : -1;
      });
      els.paymentSettingsOrderPanel.hidden = isSpecial;
      els.paymentSettingsSpecialPanel.hidden = !isSpecial;
      if (isSpecial) renderSpecialSettingsList();
      else renderOrderList();
    }

    function getPlayersForOrder(affiliation) {
      const members = state.players.filter((player) => hasPlayerAffiliation(player, affiliation));
      const byId = new Map(members.map((player) => [Number(player.id), player]));
      const savedIds = (state.paymentOrders[affiliation] || []).map(Number);
      const ordered = savedIds.map((id) => byId.get(id)).filter(Boolean);
      const orderedIds = new Set(ordered.map((player) => Number(player.id)));
      const missing = members
        .filter((player) => !orderedIds.has(Number(player.id)))
        .sort((a, b) => collator.compare(firstName(a.name), firstName(b.name)) || (Number(a.id) - Number(b.id)));
      return [...ordered, ...missing];
    }

    function renderOrderList() {
      const affiliation = state.paymentSettingsEditor.activeTab;
      if (!PAYMENT_ORDER_AFFILIATIONS.includes(affiliation)) return;
      const playersById = new Map(state.players.map((player) => [Number(player.id), player]));
      const rows = state.paymentSettingsEditor.orders[affiliation]
        .map((id) => playersById.get(Number(id)))
        .filter((player) => player && hasPlayerAffiliation(player, affiliation));
      state.paymentSettingsEditor.orders[affiliation] = rows.map((player) => Number(player.id));

      if (!rows.length) {
        const empty = document.createElement("div");
        empty.className = "empty-hint";
        empty.textContent = "暂无成员";
        els.paymentSettingsOrderList.replaceChildren(empty);
        return;
      }

      els.paymentSettingsOrderList.replaceChildren(...rows.map((player, index) => createOrderRow(player, index, rows.length)));
    }

    function createOrderRow(player, index, total) {
      const row = document.createElement("div");
      row.className = "order-row";
      row.draggable = true;
      row.dataset.playerId = String(player.id);

      const handle = document.createElement("span");
      handle.className = "drag-handle";
      handle.textContent = "☰";

      const name = document.createElement("span");
      name.className = "order-name";
      name.textContent = firstName(player.name) || player.name || "未命名";
      name.title = player.name || "";

      const actions = document.createElement("div");
      actions.className = "order-actions";
      const up = document.createElement("button");
      up.type = "button";
      up.className = "mini-btn";
      up.title = "上移";
      up.textContent = "↑";
      up.disabled = index === 0;
      up.addEventListener("click", () => moveOrderIndex(index, -1));
      const down = document.createElement("button");
      down.type = "button";
      down.className = "mini-btn";
      down.title = "下移";
      down.textContent = "↓";
      down.disabled = index === total - 1;
      down.addEventListener("click", () => moveOrderIndex(index, 1));
      actions.append(up, down);

      const orderIndex = document.createElement("span");
      orderIndex.className = "order-index";
      orderIndex.textContent = `第${index + 1}`;

      row.addEventListener("dragstart", (event) => {
        state.paymentSettingsEditor.draggingId = Number(player.id);
        row.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", String(player.id));
      });
      row.addEventListener("dragend", () => {
        state.paymentSettingsEditor.draggingId = null;
        row.classList.remove("dragging");
        els.paymentSettingsOrderList.querySelectorAll(".drop-target").forEach((item) => item.classList.remove("drop-target"));
      });
      row.addEventListener("dragover", (event) => {
        event.preventDefault();
        row.classList.add("drop-target");
      });
      row.addEventListener("dragleave", () => row.classList.remove("drop-target"));
      row.addEventListener("drop", (event) => {
        event.preventDefault();
        row.classList.remove("drop-target");
        const draggedId = Number(event.dataTransfer.getData("text/plain") || state.paymentSettingsEditor.draggingId);
        moveOrderPlayerBefore(draggedId, Number(player.id));
      });

      row.append(handle, name, actions, orderIndex);
      return row;
    }

    function moveOrderIndex(index, delta) {
      const affiliation = state.paymentSettingsEditor.activeTab;
      if (!PAYMENT_ORDER_AFFILIATIONS.includes(affiliation)) return;
      const currentIds = state.paymentSettingsEditor.orders[affiliation];
      const nextIndex = index + delta;
      if (nextIndex < 0 || nextIndex >= currentIds.length) return;
      const ids = [...currentIds];
      [ids[index], ids[nextIndex]] = [ids[nextIndex], ids[index]];
      state.paymentSettingsEditor.orders[affiliation] = ids;
      renderOrderList();
    }

    function moveOrderPlayerBefore(playerId, targetId) {
      if (!playerId || !targetId || playerId === targetId) return;
      const affiliation = state.paymentSettingsEditor.activeTab;
      if (!PAYMENT_ORDER_AFFILIATIONS.includes(affiliation)) return;
      const ids = [...state.paymentSettingsEditor.orders[affiliation]];
      const fromIndex = ids.indexOf(playerId);
      let toIndex = ids.indexOf(targetId);
      if (fromIndex < 0 || toIndex < 0) return;
      const [moved] = ids.splice(fromIndex, 1);
      if (fromIndex < toIndex) toIndex -= 1;
      ids.splice(toIndex, 0, moved);
      state.paymentSettingsEditor.orders[affiliation] = ids;
      renderOrderList();
    }

    function renderSpecialSettingsList() {
      const members = state.players
        .filter(isSpecialPlayer)
        .sort((a, b) => collator.compare(firstName(a.name), firstName(b.name)) || Number(a.id) - Number(b.id));

      if (!members.length) {
        const empty = document.createElement("div");
        empty.className = "empty-hint";
        empty.textContent = "暂无特殊成员";
        els.paymentSettingsSpecialList.replaceChildren(empty);
        return;
      }

      els.paymentSettingsSpecialList.replaceChildren(...members.map((player) => {
        const row = document.createElement("div");
        row.className = "special-setting-row";

        const name = document.createElement("span");
        name.className = "special-setting-name";
        name.textContent = firstName(player.name) || player.name || "未命名";
        name.title = player.name || "";

        const choice = document.createElement("div");
        choice.className = "special-setting-choice";
        choice.setAttribute("role", "group");
        choice.setAttribute("aria-label", `${name.textContent}的群收款设置`);
        const participates = state.paymentSettingsEditor.special[String(player.id)] !== false;

        const yesButton = document.createElement("button");
        yesButton.type = "button";
        yesButton.textContent = "参与A钱";
        yesButton.classList.toggle("active", participates);
        yesButton.setAttribute("aria-pressed", String(participates));
        yesButton.addEventListener("click", () => setSpecialPaymentChoice(player.id, true));

        const noButton = document.createElement("button");
        noButton.type = "button";
        noButton.textContent = "不A钱";
        noButton.classList.toggle("active", !participates);
        noButton.setAttribute("aria-pressed", String(!participates));
        noButton.addEventListener("click", () => setSpecialPaymentChoice(player.id, false));

        choice.append(yesButton, noButton);
        row.append(name, choice);
        return row;
      }));
    }

    function setSpecialPaymentChoice(playerId, participatesPayment) {
      state.paymentSettingsEditor.special[String(playerId)] = participatesPayment;
      renderSpecialSettingsList();
    }

    async function savePaymentSettings() {
      const specialSettings = state.players
        .filter(isSpecialPlayer)
        .map((player) => ({
          playerId: Number(player.id),
          participatesPayment: state.paymentSettingsEditor.special[String(player.id)] !== false,
        }));

      els.savePaymentSettingsBtn.disabled = true;
      setSync("正在保存群收款设置");
      try {
        const data = await api("/api/payment-settings", {
          method: "PUT",
          body: JSON.stringify({
            orders: Object.fromEntries(PAYMENT_ORDER_AFFILIATIONS.map((affiliation) => [
              affiliation,
              state.paymentSettingsEditor.orders[affiliation],
            ])),
            specialSettings,
          }),
        });
        state.players = data.players || state.players;
        state.paymentOrders = normalizePaymentOrders(data.paymentOrders);
        setSync("已保存");
        toast("群收款设置已保存");
        closeModal("paymentSettingsModal");
        renderTable();
        if (els.paymentModal.classList.contains("open")) openPaymentModal();
      } catch (error) {
        setSync("保存失败");
        toast(`保存群收款设置失败：${error.message}`);
      } finally {
        els.savePaymentSettingsBtn.disabled = false;
      }
    }

    function calculatePayment(entries, courtFee, shuttlePrice, shuttleCount) {
      const payingEntries = entries.filter(shouldCountForPayment);
      const payerCount = payingEntries.length;
      const femaleCount = payingEntries.filter((entry) => entry.isFemale).length;
      const maleCount = payerCount - femaleCount;
      const totalCost = courtFee + shuttlePrice * shuttleCount;
      const perPerson = ceilOneDecimal(totalCost / Math.max(1, payerCount));
      const femaleCapApplied = femaleCount > 0 && maleCount > 0 && perPerson > FEMALE_PAYMENT_CAP;
      const femalePerPerson = femaleCapApplied ? FEMALE_PAYMENT_CAP : perPerson;
      const malePerPerson = femaleCapApplied
        ? ceilOneDecimal((totalCost - femalePerPerson * femaleCount) / maleCount)
        : perPerson;
      const groups = { friends: new Map(), heineken: new Map(), special: new Map() };
      const sharedPaymentGroup = getSharedPaymentGroup(entries);
      let sequence = 0;

      for (const entry of entries) {
        const player = entry.player;
        const canonicalName = player ? paymentDisplayName(player) : getChainEntryBaseName(entry);
        if (!entry.clean) continue;

        if (isSpecialPlayer(player) && player.participatesPayment === false) {
          addPaymentLine(groups.special, canonicalName, 0, "不参与A钱", 0, player.id, sequence++, entry.isFemale);
          continue;
        }
        if (!shouldCountForPayment(entry)) continue;

        const groupName = getPaymentGroup(player, sharedPaymentGroup);
        const entryAmount = entry.isFemale ? femalePerPerson : malePerPerson;
        addPaymentLine(groups[groupName], canonicalName, entryAmount, null, 1, player?.id || null, sequence++, entry.isFemale);
      }

      return {
        payerCount,
        perPerson,
        femaleCount,
        maleCount,
        femalePerPerson,
        malePerPerson,
        femaleCapApplied,
        groups: {
          friends: mapToPaymentRows(groups.friends, PAYMENT_GROUPS.friends),
          heineken: mapToPaymentRows(groups.heineken, PAYMENT_GROUPS.heineken),
          special: mapToPaymentRows(groups.special),
        },
      };
    }

    function shouldCountForPayment(entry) {
      if (!entry.clean) return false;
      if (isSpecialPlayer(entry.player) && entry.player.participatesPayment === false) return false;
      return true;
    }

    function getSharedPaymentGroup(entries) {
      const groupableEntries = entries.filter((entry) => shouldCountForPayment(entry) && !isSpecialPlayer(entry.player));
      if (!groupableEntries.length) return null;
      if (groupableEntries.every((entry) => canEntryUsePaymentGroup(entry, "heineken"))) return "heineken";
      if (groupableEntries.every((entry) => canEntryUsePaymentGroup(entry, "friends"))) return "friends";
      return null;
    }

    function canEntryUsePaymentGroup(entry, groupName) {
      if (!entry.player) return groupName === "friends";
      return hasPlayerAffiliation(entry.player, PAYMENT_GROUPS[groupName]);
    }

    function getPaymentGroup(player, sharedPaymentGroup) {
      if (isSpecialPlayer(player)) return "special";
      if (sharedPaymentGroup) return sharedPaymentGroup;
      if (hasPlayerAffiliation(player, "海尼克") && !hasPlayerAffiliation(player, "球友")) return "heineken";
      return "friends";
    }

    function addPaymentLine(map, name, amount, note, slots, playerId, sequence, isFemale = false) {
      const key = playerId ? `player:${playerId}` : `name:${name}`;
      const current = map.get(key) || {
        name,
        amount: 0,
        note: null,
        slots: 0,
        playerId: playerId || null,
        sequence,
        hasFemale: false,
        hasMale: false,
        femaleSlots: 0,
        maleSlots: 0,
      };
      current.amount += amount;
      current.slots += slots;
      current.hasFemale = current.hasFemale || isFemale;
      current.hasMale = current.hasMale || !isFemale;
      current.femaleSlots += isFemale ? slots : 0;
      current.maleSlots += isFemale ? 0 : slots;
      if (note) current.note = note;
      if (playerId && !current.playerId) current.playerId = playerId;
      current.sequence = Math.min(current.sequence, sequence);
      map.set(key, current);
    }

    function mapToPaymentRows(map, affiliation) {
      const rows = [...map.values()];
      if (!affiliation) return rows.sort((a, b) => collator.compare(a.name, b.name));

      const orderMap = new Map((state.paymentOrders[affiliation] || []).map((id, index) => [Number(id), index]));
      return rows.sort((a, b) => {
        const aOrder = a.playerId && orderMap.has(Number(a.playerId)) ? orderMap.get(Number(a.playerId)) : Number.MAX_SAFE_INTEGER;
        const bOrder = b.playerId && orderMap.has(Number(b.playerId)) ? orderMap.get(Number(b.playerId)) : Number.MAX_SAFE_INTEGER;
        if (aOrder !== bOrder) return aOrder - bOrder;
        return (a.sequence - b.sequence) || collator.compare(a.name, b.name);
      });
    }

    function formatPaymentGroup(rows, showTotal) {
      if (!rows.length) return "";
      const lines = rows.map((row) => `${paymentRowDisplayName(row)}：${formatMoney(row.amount)}`);
      if (showTotal) lines.push(`总计：${formatMoney(rows.reduce((sum, row) => sum + row.amount, 0))}`);
      return lines.join("\n");
    }

    function formatSpecialGroup(rows) {
      if (!rows.length) return "";
      return rows.map((row) => row.note
        ? `${paymentRowDisplayName(row)}：${row.note}`
        : `${paymentRowDisplayName(row)}：${formatMoney(row.amount)}`).join("\n");
    }

    function renderPaymentGroup(container, rows, { showTotal, femaleCapApplied }) {
      const elements = rows.map((row) => {
        const highlights = getPaymentRowHighlights(row, femaleCapApplied);
        const line = document.createElement("div");
        line.className = "payment-line";
        line.classList.toggle("companion-highlight", highlights.companion);
        line.classList.toggle("female-cap-highlight", highlights.femaleCap);

        const main = document.createElement("span");
        main.className = "payment-line-main";
        main.textContent = row.note
          ? `${paymentRowDisplayName(row)}：${row.note}`
          : `${paymentRowDisplayName(row)}：${formatMoney(row.amount)}`;
        line.append(main);

        if (highlights.companion || highlights.femaleCap) {
          const badges = document.createElement("span");
          badges.className = "payment-line-badges";
          if (highlights.companion) badges.append(createPaymentBadge(formatPaymentComposition(row), "companion"));
          if (highlights.femaleCap) badges.append(createPaymentBadge("25封顶", "female-cap"));
          line.append(badges);
        }
        return line;
      });

      if (showTotal && rows.length) {
        const total = document.createElement("div");
        total.className = "payment-total-line";
        total.textContent = `总计：${formatMoney(rows.reduce((sum, row) => sum + row.amount, 0))}`;
        elements.push(total);
      }
      container.replaceChildren(...elements);
    }

    function createPaymentBadge(text, type) {
      const badge = document.createElement("span");
      badge.className = `payment-line-badge ${type}`;
      badge.textContent = text;
      return badge;
    }

    function getPaymentRowHighlights(row, femaleCapApplied) {
      return {
        companion: Number(row?.slots) > 1,
        femaleCap: Boolean(femaleCapApplied && row?.slots > 0 && row?.hasFemale && !row?.hasMale),
      };
    }

    function formatPaymentComposition(row) {
      const maleSlots = Number(row?.maleSlots) || 0;
      const femaleSlots = Number(row?.femaleSlots) || 0;
      return [
        maleSlots > 0 ? `🍀x${maleSlots}` : "",
        femaleSlots > 0 ? `🌸x${femaleSlots}` : "",
      ].filter(Boolean).join("，");
    }

    function paymentRowDisplayName(row) {
      const name = String(row?.name || "");
      if (!row?.hasFemale || row?.hasMale || name.includes("🌸")) return name;
      return `${name}🌸`;
    }

    function buildAliasIndex() {
      return state.players.flatMap((player) => splitAliases(player.name).map((alias) => ({
        alias,
        normalized: normalizeAlias(alias),
        player,
      }))).filter((item) => item.normalized).sort((a, b) => b.normalized.length - a.normalized.length);
    }

    function findPlayerForLine(line, aliasIndex) {
      const normalized = normalizeAlias(removeChainAnnotations(line));
      const match = aliasIndex.find((item) => normalized.includes(item.normalized));
      return match?.player || null;
    }

    function removeChainAnnotations(value) {
      return String(value || "").replace(/\([^)]*\)|（[^）]*）/g, " ");
    }

    function splitAliases(name) {
      return String(name || "").split(/[,，]/).map((part) => part.trim()).filter(Boolean);
    }

    function firstName(name) {
      return splitAliases(name)[0] || "";
    }

    function paymentDisplayName(player) {
      return firstName(player.name);
    }

    async function pasteChainInput() {
      try {
        els.chainInput.value = await navigator.clipboard.readText();
        processChain();
        toast("已粘贴");
      } catch (error) {
        toast("浏览器没有允许读取剪贴板");
      }
    }

    async function copyChainOutput() {
      try {
        await navigator.clipboard.writeText(state.chainOutputText);
        toast("已复制");
      } catch (error) {
        toast("浏览器没有允许写入剪贴板");
      }
    }

    function openModal(id) {
      document.getElementById(id)?.classList.add("open");
    }

    function closeModal(id) {
      document.getElementById(id)?.classList.remove("open");
    }

    function closeTopModal() {
      const open = [...document.querySelectorAll(".modal-backdrop.open")].at(-1);
      if (open) closeModal(open.id);
    }

    function isAnyModalOpen() {
      return Boolean(document.querySelector(".modal-backdrop.open"));
    }

    function toast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => els.toast.classList.remove("show"), 2600);
    }

    function cleanChainLine(line) {
      return String(line || "").replace(CHAIN_NUMBER_PREFIX, "").trim();
    }

    function getChainInputLines(rawInput) {
      const lines = String(rawInput || "").split(/\r?\n/);
      const numberedLines = lines.filter((line) => CHAIN_NUMBER_PREFIX.test(line));
      return numberedLines.length ? numberedLines : lines;
    }

    function normalizeAlias(value) {
      return String(value || "").normalize("NFKC").toLowerCase().replace(/\s+/g, "");
    }

    function normalizeSearch(value) {
      return String(value || "").normalize("NFKC").toLowerCase();
    }

    function levelRank(level) {
      if (!level || level === "不详" || level === "等级不详") return -1;
      const number = Number.parseFloat(String(level).replace("级", ""));
      return Number.isFinite(number) ? number : -1;
    }

    function ceilOneDecimal(value) {
      return Math.ceil((value + Number.EPSILON) * 10) / 10;
    }

    function formatMoney(value) {
      return (Math.round(value * 10) / 10).toFixed(1);
    }

    function formatCompactNumber(value) {
      return String(Math.round((value + Number.EPSILON) * 100) / 100);
    }

    function isPrintableKey(event) {
      return event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey;
    }

    function isTextControl(element) {
      if (!element) return false;
      const tag = element.tagName;
      return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || element.isContentEditable;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[char]));
    }

    function escapeXml(value) {
      return String(value).replace(/[&<>"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[char]));
    }

    function cssEscape(value) {
      return String(value).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    }

    function columnLetter(index) {
      let letter = "";
      while (index > 0) {
        const mod = (index - 1) % 26;
        letter = String.fromCharCode(65 + mod) + letter;
        index = Math.floor((index - mod) / 26);
      }
      return letter;
    }

    function getDosTimeDate(date) {
      const dosTime = (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2);
      const dosDate = ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
      return { dosTime, dosDate };
    }

    function concatUint8(parts) {
      const total = parts.reduce((sum, part) => sum + part.length, 0);
      const output = new Uint8Array(total);
      let offset = 0;
      for (const part of parts) {
        output.set(part, offset);
        offset += part.length;
      }
      return output;
    }

    let crcTable;
    function crc32(data) {
      if (!crcTable) {
        crcTable = new Uint32Array(256);
        for (let i = 0; i < 256; i++) {
          let c = i;
          for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
          crcTable[i] = c >>> 0;
        }
      }
      let crc = 0xffffffff;
      for (const byte of data) crc = crcTable[(crc ^ byte) & 0xff] ^ (crc >>> 8);
      return (crc ^ 0xffffffff) >>> 0;
    }

    init();
  </script>
