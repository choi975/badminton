    function replacePlayer(player) {
      const index = state.players.findIndex((item) => item.id === player.id);
      if (index >= 0) state.players.splice(index, 1, player);
    }

    function getPlayerByKey(rowKey) {
      if (rowKey === "draft") return state.draft;
      return state.players.find((player) => String(player.id) === String(rowKey));
    }

    function normalizeGroupJoinNumbers(rawNumbers = {}, fallbackOrders = {}) {
      const normalized = { "球友": [], "Hytronik": [] };
      for (const affiliation of PAYMENT_ORDER_AFFILIATIONS) {
        const entries = Array.isArray(rawNumbers?.[affiliation]) ? rawNumbers[affiliation] : [];
        const seenPlayers = new Set();
        const seenNumbers = new Set();
        normalized[affiliation] = entries
          .map((entry) => ({ playerId: Number(entry?.playerId), joinNumber: Number(entry?.joinNumber) }))
          .filter((entry) => {
            if (!Number.isInteger(entry.playerId) || entry.playerId <= 0 || !Number.isInteger(entry.joinNumber) || entry.joinNumber <= 0) return false;
            if (seenPlayers.has(entry.playerId) || seenNumbers.has(entry.joinNumber)) return false;
            seenPlayers.add(entry.playerId);
            seenNumbers.add(entry.joinNumber);
            return true;
          })
          .sort(compareJoinNumberEntries);

        if (!normalized[affiliation].length && Array.isArray(fallbackOrders?.[affiliation])) {
          normalized[affiliation] = [...new Set(fallbackOrders[affiliation].map(Number).filter((id) => Number.isInteger(id) && id > 0))]
            .map((playerId, index) => ({ playerId, joinNumber: index + 1 }));
        }
      }
      return normalized;
    }

    function applyPaymentOrderState(data = {}) {
      state.groupJoinNumbers = normalizeGroupJoinNumbers(data.groupJoinNumbers, data.paymentOrders);
      state.paymentOrders = Object.fromEntries(PAYMENT_ORDER_AFFILIATIONS.map((affiliation) => [
        affiliation,
        state.groupJoinNumbers[affiliation].map((entry) => entry.playerId),
      ]));
    }

    function compareJoinNumberEntries(a, b) {
      return (a.joinNumber - b.joinNumber) || (a.playerId - b.playerId);
    }

    function normalizeEstimator(raw) {
      if (!raw || typeof raw !== "object") return DEFAULT_ESTIMATOR;
      return {
        ...DEFAULT_ESTIMATOR,
        ...raw,
        training: { ...DEFAULT_ESTIMATOR.training, ...(raw.training || {}) },
        shuttleTypes: Array.isArray(raw.shuttleTypes) && raw.shuttleTypes.length
          ? raw.shuttleTypes
          : DEFAULT_ESTIMATOR.shuttleTypes,
        court: { ...DEFAULT_ESTIMATOR.court, ...(raw.court || {}) },
        shuttle: { ...DEFAULT_ESTIMATOR.shuttle, ...(raw.shuttle || {}) },
      };
    }

    function normalizeSessions(rawSessions) {
      return (Array.isArray(rawSessions) ? rawSessions : []).map((session) => ({
        id: Number(session.id),
        date: String(session.date || ""),
        venue: session.venue === "EDC" ? "EDC" : "文体",
        courtCount: Number(session.courtCount) || 0,
        courtFee: Number(session.courtFee) || 0,
        shuttlePrice: Number(session.shuttlePrice) || 0,
        shuttleCount: Number(session.shuttleCount) || 0,
        courtPriceRows: Array.isArray(session.courtPriceRows) ? session.courtPriceRows : null,
        shuttlePriceRows: Array.isArray(session.shuttlePriceRows)
          ? session.shuttlePriceRows.map((row) => ({
              ...row,
              type: row.type || findShuttleTypeByPrice(Number(row.price))?.id || "unknown",
            }))
          : null,
        players: (Array.isArray(session.players) ? session.players : []).map((row) => ({
          playerId: row.playerId === null || row.playerId === undefined ? null : Number(row.playerId),
          playerName: String(row.playerName || ""),
          slots: Number(row.slots) || 0,
          plusCount: Number(row.plusCount) || 0,
          amount: Number(row.amount) || 0,
          isFemale: Boolean(row.isFemale),
          gender: ["男", "女", "不详"].includes(row.gender)
            ? row.gender
            : Boolean(row.isFemale) ? "女" : "不详",
          level: LEVELS.includes(row.level) ? row.level : "不详",
        })),
        createdAt: session.createdAt,
        updatedAt: session.updatedAt,
      }));
    }

    function getMemberStatsMap() {
      const statsMap = new Map();
      for (const session of state.sessions) {
        for (const row of session.players) {
          if (row.playerId === null) continue;
          const stats = statsMap.get(row.playerId) || { playCount: 0, guestCount: 0, amountTotal: 0 };
          stats.playCount += 1;
          stats.guestCount += row.plusCount;
          stats.amountTotal += row.amount;
          statsMap.set(row.playerId, stats);
        }
      }
      return statsMap;
    }

    function getMemberStats(playerId) {
      return getMemberStatsMap().get(Number(playerId)) || { playCount: 0, guestCount: 0, amountTotal: 0 };
    }

    function getLocalDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function parseLocalDate(value) {
      const parts = String(value || "").split("-").map(Number);
      return new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1);
    }

    function formatCalendarDate(value) {
      const date = parseLocalDate(value);
      if (Number.isNaN(date.getTime())) return value || "";
      const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
      return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 星期${weekdays[date.getDay()]}`;
    }

    function inferCourtCounts(fee) {
      if (!Number.isFinite(fee) || fee <= 0) return [];
      const candidates = new Set();
      if (fee % 70 === 0) candidates.add(fee / 70);
      if (fee % 80 === 0) candidates.add(fee / 80);
      return [...candidates].sort((a, b) => a - b);
    }

    function makeCourtCountHint(fee, candidates) {
      if (!Number.isFinite(fee)) return "";
      if (fee === 0) return "场地费为0，请填写订场数量";
      if (candidates.length === 1) return `已按${formatCompactNumber(fee / candidates[0])}元/场自动推算`;
      if (candidates.length > 1) return `可能是${candidates.map((count) => `${count}个场`).join("或")}，请确认`;
      return "无法按70/80元/场推算，请确认订场数量";
    }

    function onRecordCourtFeeChange() {
      const fee = Number(els.recordCourtFeeInput.value);
      const candidates = inferCourtCounts(fee);
      els.recordCourtCountHint.textContent = makeCourtCountHint(fee, candidates);
      if (candidates.length === 1) {
        els.recordCourtCountInput.value = String(candidates[0]);
      }
    }

    function formatPaymentDate(dateString) {
      const date = parseLocalDate(dateString);
      if (Number.isNaN(date.getTime())) return dateString || "";
      return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
    }

    function handleRecordPayment() {
      if (state.readOnly) {
        toast("当前为只读模式，不能记录订场");
        return;
      }
      const record = state.currentPaymentRecord;
      if (!record) {
        toast("没有可保存的群收款数据");
        return;
      }
      if (state.pendingSessionEdit) {
        openRecordDialogForChainEdit();
        return;
      }
      if (state.feeMode === "advanced") {
        void savePaymentRecordDirect(record.courtCount);
        return;
      }
      const candidates = inferCourtCounts(record.courtFee);
      if (candidates.length === 1) {
        void savePaymentRecordDirect(candidates[0]);
      } else {
        openRecordDialog();
      }
    }

    function openRecordDialogForChainEdit() {
      const record = state.currentPaymentRecord;
      const pending = state.pendingSessionEdit;
      const advanced = state.feeMode === "advanced";
      const candidates = inferCourtCounts(record.courtFee);
      openRecordDialog({
        session: {
          id: pending.id,
          date: pending.date,
          venue: pending.venue,
          courtFee: record.courtFee,
          shuttlePrice: record.shuttlePrice,
          shuttleCount: record.shuttleCount,
          courtCount: advanced ? record.courtCount : (candidates.length === 1 ? candidates[0] : ""),
          courtPriceRows: record.courtPriceRows,
          shuttlePriceRows: record.shuttlePriceRows,
          players: record.players,
        },
      });
    }

    async function savePaymentRecordDirect(courtCount) {
      const record = state.currentPaymentRecord;
      if (!record) return;
      els.paymentRecordBtn.disabled = true;
      setSync("正在记录订场");
      try {
        const body = {
          date: getLocalDateString(),
          venue: "EDC",
          courtCount,
          courtFee: record.courtFee,
          shuttlePrice: record.shuttlePrice,
          shuttleCount: record.shuttleCount,
          players: record.players,
        };
        if (record.courtPriceRows?.length) body.courtPriceRows = record.courtPriceRows;
        if (record.shuttlePriceRows?.length) body.shuttlePriceRows = record.shuttlePriceRows;
        const data = await api("/api/sessions", {
          method: "POST",
          body: JSON.stringify(body),
        });
        upsertSession(data.session);
        setSync("已保存");
        closeModal("paymentModal");
        renderTable();
        toast("订场记录已保存");
      } catch (error) {
        setSync("保存失败");
        toast(`保存订场记录失败：${error.message}`);
      } finally {
        els.paymentRecordBtn.disabled = false;
      }
    }

    function openRecordDialog({ session = null } = {}) {
      if (state.readOnly) {
        toast("当前为只读模式，不能记录订场");
        return;
      }
      const editing = Boolean(session);
      const source = state.currentPaymentRecord;
      const advanced = editing
        ? Boolean(session.courtPriceRows?.length || session.shuttlePriceRows?.length || state.feeMode === "advanced")
        : state.feeMode === "advanced";
      const courtFee = editing ? session.courtFee : (source?.courtFee ?? 0);
      const candidates = inferCourtCounts(courtFee);
      els.recordTitle.textContent = editing ? "编辑订场记录" : "记录本次订场";
      els.recordDateInput.value = editing ? session.date : getLocalDateString();
      els.recordCourtFeeInput.value = formatCompactNumber(courtFee);
      els.recordCourtCountInput.value = editing
        ? String(session.courtCount)
        : (candidates.length === 1 ? String(candidates[0]) : "");
      els.recordShuttlePriceInput.value = editing
        ? formatCompactNumber(session.shuttlePrice)
        : formatCompactNumber(source?.shuttlePrice ?? 0);
      els.recordShuttleCountInput.value = editing
        ? String(session.shuttleCount)
        : String(source?.shuttleCount ?? 0);
      els.recordCourtCountHint.textContent = makeCourtCountHint(courtFee, candidates);
      state.recordRows = {
        court: advanced
          ? (editing ? session.courtPriceRows || [] : source?.courtPriceRows || []).map((row) => ({ ...row }))
          : [],
        shuttle: advanced
          ? (editing ? session.shuttlePriceRows || [] : source?.shuttlePriceRows || []).map((row) => ({ ...row }))
          : [],
      };
      applyRecordFeeMode(advanced);
      renderRecordMembers(editing ? session.players : (source?.players || []));
      els.recordModal.dataset.editing = editing ? "1" : "0";
      els.recordModal.dataset.sessionId = editing ? String(session.id) : "";
      els.recordModal.dataset.venue = editing ? session.venue : "EDC";
      openModal("recordModal");
    }

    function renderRecordMembers(rows) {
      if (!rows.length) {
        const empty = document.createElement("div");
        empty.className = "empty-hint";
        empty.textContent = "暂无成员明细";
        els.recordMembersList.replaceChildren(empty);
        return;
      }
      els.recordMembersList.replaceChildren(...rows.map(createRecordMemberRow));
    }

    function createRecordMemberRow(row) {
      const div = document.createElement("div");
      div.className = "record-member-row";
      div.dataset.playerId = row.playerId === null || row.playerId === undefined ? "" : String(row.playerId);
      div.dataset.isFemale = row.isFemale ? "1" : "0";
      div.dataset.gender = ["男", "女", "不详"].includes(row.gender)
        ? row.gender
        : row.isFemale ? "女" : "不详";
      div.dataset.level = LEVELS.includes(row.level) ? row.level : "不详";

      const name = document.createElement("span");
      name.className = "record-member-name";
      name.textContent = row.playerName || "未知成员";
      name.title = row.playerName || "";

      const slotsField = document.createElement("label");
      slotsField.className = "record-member-field";
      const slotsLabel = document.createElement("span");
      slotsLabel.textContent = "人数";
      const slotsInput = document.createElement("input");
      slotsInput.className = "record-member-slots";
      slotsInput.type = "number";
      slotsInput.min = "0";
      slotsInput.step = "1";
      slotsInput.inputMode = "numeric";
      slotsInput.value = String(Math.max(0, Math.floor(Number(row.slots) || 0)));
      slotsField.append(slotsLabel, slotsInput);

      const plus = document.createElement("span");
      plus.className = "record-member-plus";
      const updatePlus = () => {
        const slots = Math.max(0, Math.floor(Number(slotsInput.value) || 0));
        plus.textContent = slots > 0 ? `带${Math.max(0, slots - 1)}人` : "";
      };
      slotsInput.addEventListener("input", updatePlus);
      updatePlus();

      const amountField = document.createElement("label");
      amountField.className = "record-member-field";
      const amountLabel = document.createElement("span");
      amountLabel.textContent = "A钱";
      const amountInput = document.createElement("input");
      amountInput.className = "record-member-amount";
      amountInput.type = "number";
      amountInput.min = "0";
      amountInput.step = "any";
      amountInput.inputMode = "decimal";
      amountInput.value = formatCompactNumber(Number(row.amount) || 0);
      amountField.append(amountLabel, amountInput);

      div.append(name, slotsField, plus, amountField);
      return div;
    }

    async function saveRecordDialog() {
      if (state.readOnly) {
        toast("当前为只读模式，不能保存订场记录");
        return;
      }
      const date = els.recordDateInput.value;
      if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
        toast("请选择日期");
        return;
      }

      const players = [...els.recordMembersList.querySelectorAll(".record-member-row")].map((row) => {
        const slots = Math.max(0, Math.floor(Number(row.querySelector(".record-member-slots")?.value) || 0));
        return {
          playerId: row.dataset.playerId ? Number(row.dataset.playerId) : null,
          playerName: (row.querySelector(".record-member-name")?.textContent || "").trim(),
          slots,
          plusCount: Math.max(0, slots - 1),
          amount: Math.max(0, Number(row.querySelector(".record-member-amount")?.value) || 0),
          isFemale: row.dataset.isFemale === "1",
          gender: row.dataset.gender || "不详",
          level: row.dataset.level || "不详",
        };
      });

      let courtCount;
      let courtFee;
      let shuttlePrice;
      let shuttleCount;
      let courtPriceRows = [];
      let shuttlePriceRows = [];
      const advanced = !els.recordAdvancedArea.hidden;
      if (advanced) {
        courtPriceRows = state.recordRows.court.filter((row) => row.count > 0);
        shuttlePriceRows = state.recordRows.shuttle.filter((row) => row.count > 0);
        if (!courtPriceRows.length) {
          toast("请至少填写一行有效的场地单价和个数");
          return;
        }
        courtCount = courtPriceRows.reduce((sum, row) => sum + row.count, 0);
        courtFee = courtPriceRows.reduce((sum, row) => sum + row.price * row.count, 0);
        shuttleCount = shuttlePriceRows.reduce((sum, row) => sum + row.count, 0);
        const shuttleCost = shuttlePriceRows.reduce((sum, row) => sum + row.price * row.count, 0);
        shuttlePrice = shuttleCount > 0 ? shuttleCost / shuttleCount : 0;
      } else {
        courtCount = Number(els.recordCourtCountInput.value);
        courtFee = Number(els.recordCourtFeeInput.value);
        shuttlePrice = Number(els.recordShuttlePriceInput.value);
        shuttleCount = Number(els.recordShuttleCountInput.value);
        if (!Number.isInteger(courtCount) || courtCount <= 0) {
          toast("订场数量需要填写大于0的整数");
          return;
        }
        if (!Number.isFinite(courtFee) || courtFee < 0 || !Number.isFinite(shuttlePrice) || shuttlePrice < 0) {
          toast("费用需要填写不小于0的数字");
          return;
        }
        if (!Number.isInteger(shuttleCount) || shuttleCount < 0) {
          toast("球个数需要填写不小于0的整数");
          return;
        }
        courtPriceRows = deriveCourtRows(courtFee, courtCount);
        if (shuttleCount > 0) {
          shuttlePriceRows = [{
            price: shuttlePrice,
            count: shuttleCount,
            type: findShuttleTypeByPrice(shuttlePrice)?.id || "unknown",
          }];
        }
      }

      const sessionId = Number(els.recordModal.dataset.sessionId || 0);
      const editing = els.recordModal.dataset.editing === "1" && Number.isInteger(sessionId) && sessionId > 0;
      els.saveRecordBtn.disabled = true;
      setSync(editing ? "正在保存订场记录" : "正在记录订场");
      try {
        const body = {
          date,
          venue: editing ? (els.recordModal.dataset.venue || "文体") : "EDC",
          courtCount,
          courtFee,
          shuttlePrice,
          shuttleCount,
          players,
        };
        if (courtPriceRows.length) body.courtPriceRows = courtPriceRows;
        if (shuttlePriceRows.length) body.shuttlePriceRows = shuttlePriceRows;
        const data = editing
          ? await api(`/api/sessions/${sessionId}`, { method: "PATCH", body: JSON.stringify(body) })
          : await api("/api/sessions", { method: "POST", body: JSON.stringify(body) });
        upsertSession(data.session);
        setSync("已保存");
        closeModal("recordModal");
        renderTable();
        if (state.pendingSessionEdit) {
          state.pendingSessionEdit = null;
          state.returnToCalendar = false;
          closeModal("paymentModal");
          closeModal("chainModal");
          openModal("calendarModal");
          renderCalendar();
        } else if (els.calendarModal.classList.contains("open")) {
          renderCalendar();
        }
        toast(editing ? "订场记录已更新" : "订场记录已保存");
      } catch (error) {
        setSync("保存失败");
        toast(`保存订场记录失败：${error.message}`);
      } finally {
        els.saveRecordBtn.disabled = false;
      }
    }

    function upsertSession(session) {
      const normalized = normalizeSessions([session])[0];
      const index = state.sessions.findIndex((item) => item.id === normalized.id);
      if (index >= 0) state.sessions.splice(index, 1, normalized);
      else state.sessions.push(normalized);
      state.sessions.sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);
    }

    const CALENDAR_INITIAL_MONTHS_EACH_SIDE = 12;
    const CALENDAR_RANGE_CHUNK = 6;

    function calendarMonthIndex(year, month) {
      return year * 12 + month - 1;
    }

    function calendarMonthFromIndex(index) {
      const year = Math.floor(index / 12);
      const month = index - year * 12 + 1;
      return { year, month };
    }

    function calendarMonthKey(year, month) {
      return `${year}-${String(month).padStart(2, "0")}`;
    }

    function parseCalendarMonthKey(key) {
      const [year, month] = String(key || "").split("-").map(Number);
      return { year, month };
    }

    function formatCalendarMonth(year, month) {
      return `${year}年${month}月`;
    }

    function formatCalendarSummaryMonth(year, month) {
      return year === new Date().getFullYear() ? `${month}月` : formatCalendarMonth(year, month);
    }

    function setCalendarActiveMonth(year, month, { refreshDetails = true } = {}) {
      const changed = state.calendar.year !== year || state.calendar.month !== month;
      state.calendar.year = year;
      state.calendar.month = month;
      els.calendarMonthLabel.textContent = formatCalendarMonth(year, month);
      if (changed) updateCalendarActiveMonthStyles();
      if (changed && refreshDetails && !state.calendar.selectedDates.length) {
        renderCalendarSelection();
        renderCalendarDayPanel();
      }
    }

    function updateCalendarActiveMonthStyles() {
      const activeKey = calendarMonthKey(state.calendar.year, state.calendar.month);
      els.calendarGrid.querySelectorAll(".calendar-day[data-month]").forEach((button) => {
        button.classList.toggle("ghost", button.dataset.month !== activeKey);
      });
    }

    function openCalendarModal() {
      const today = new Date();
      if (state.calendar.scrollRaf) cancelAnimationFrame(state.calendar.scrollRaf);
      state.calendar = {
        year: today.getFullYear(),
        month: today.getMonth() + 1,
        selectedDates: [],
        anchorDate: "",
        dragStart: "",
        dragActive: false,
        moved: false,
        rangeStart: null,
        rangeEnd: null,
        scrollRaf: 0,
      };
      openModal("calendarModal");
      renderCalendar({ resetRange: true, preserveScroll: false });
      requestAnimationFrame(() => scrollCalendarToMonth(state.calendar.year, state.calendar.month, "auto"));
    }

    function shiftCalendarMonth(delta) {
      const targetIndex = calendarMonthIndex(state.calendar.year, state.calendar.month) + delta;
      const target = calendarMonthFromIndex(targetIndex);
      state.calendar.selectedDates = [];
      state.calendar.anchorDate = "";
      setCalendarActiveMonth(target.year, target.month, { refreshDetails: false });
      refreshCalendarSelection();
      ensureCalendarMonthRendered(target.year, target.month);
      scrollCalendarToMonth(target.year, target.month, "smooth");
    }

    function goToCalendarToday() {
      const today = new Date();
      state.calendar.selectedDates = [];
      state.calendar.anchorDate = "";
      setCalendarActiveMonth(today.getFullYear(), today.getMonth() + 1, { refreshDetails: false });
      refreshCalendarSelection();
      ensureCalendarMonthRendered(state.calendar.year, state.calendar.month);
      scrollCalendarToMonth(state.calendar.year, state.calendar.month, "smooth");
    }

    function getSessionsOnDate(dateString) {
      return state.sessions.filter((session) => session.date === dateString);
    }

    function getSessionsForSelection() {
      const selection = state.calendar.selectedDates;
      if (!selection.length) {
        const { year, month } = state.calendar;
        const monthPrefix = `${year}-${String(month).padStart(2, "0")}`;
        return state.sessions.filter((session) => session.date.startsWith(monthPrefix));
      }
      const selectionSet = new Set(selection);
      return state.sessions.filter((session) => selectionSet.has(session.date));
    }

    function dateStringsBetween(start, end) {
      const from = parseLocalDate(start);
      const to = parseLocalDate(end);
      const [first, last] = from <= to ? [from, to] : [to, from];
      const result = [];
      const current = new Date(first);
      while (current <= last) {
        result.push(getLocalDateString(current));
        current.setDate(current.getDate() + 1);
      }
      return result;
    }

    function datesInDragRect(startDate, endDate) {
      const startButton = els.calendarGrid.querySelector(`[data-date="${startDate}"]`);
      const endButton = els.calendarGrid.querySelector(`[data-date="${endDate}"]`);
      if (!startButton || !endButton) return dateStringsBetween(startDate, endDate);
      const startRect = startButton.getBoundingClientRect();
      const endRect = endButton.getBoundingClientRect();
      const minX = Math.min(startRect.left + startRect.width / 2, endRect.left + endRect.width / 2) - 1;
      const maxX = Math.max(startRect.left + startRect.width / 2, endRect.left + endRect.width / 2) + 1;
      const minY = Math.min(startRect.top + startRect.height / 2, endRect.top + endRect.height / 2) - 1;
      const maxY = Math.max(startRect.top + startRect.height / 2, endRect.top + endRect.height / 2) + 1;
      return [...els.calendarGrid.querySelectorAll(".calendar-day[data-date]")]
        .filter((button) => {
          const rect = button.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          return centerX >= minX && centerX <= maxX && centerY >= minY && centerY <= maxY;
        })
        .map((button) => button.dataset.date)
        .sort();
    }

    function refreshCalendarSelection() {
      const selected = new Set(state.calendar.selectedDates);
      els.calendarGrid.querySelectorAll(".calendar-day[data-date]").forEach((button) => {
        button.classList.toggle("selected", selected.has(button.dataset.date));
      });
      renderCalendarSelection();
      renderCalendarDayPanel();
    }

    function toggleCalendarDate(dateString) {
      const index = state.calendar.selectedDates.indexOf(dateString);
      if (index >= 0) state.calendar.selectedDates.splice(index, 1);
      else state.calendar.selectedDates.push(dateString);
      state.calendar.selectedDates.sort();
      state.calendar.anchorDate = dateString;
      refreshCalendarSelection();
    }

    function endCalendarDrag() {
      if (!state.calendar.dragActive) return;
      const moved = state.calendar.moved;
      const pressDate = state.calendar.dragStart;
      state.calendar.dragActive = false;
      state.calendar.moved = false;
      if (!moved) {
        if (pressDate) {
          state.calendar.selectedDates = [pressDate];
          state.calendar.anchorDate = pressDate;
        } else {
          state.calendar.selectedDates = [];
          state.calendar.anchorDate = "";
        }
      }
      refreshCalendarSelection();
    }

    function handleCalendarDragMove(event) {
      if (!state.calendar.dragActive) return;
      const target = event.target.closest?.(".calendar-day:not(.empty)");
      const dateString = target?.dataset?.date;
      if (!dateString || dateString === state.calendar.lastDragDate) return;
      state.calendar.lastDragDate = dateString;
      state.calendar.moved = true;
      state.calendar.selectedDates = datesInDragRect(state.calendar.dragStart, dateString);
      state.calendar.anchorDate = dateString;
      refreshCalendarSelection();
    }

    function createCalendarDayButton(date) {
      const todayString = getLocalDateString();
      const dateString = getLocalDateString(date);
      const daySessions = getSessionsOnDate(dateString);
      const courts = daySessions.reduce((sum, session) => sum + session.courtCount, 0);
      const button = document.createElement("button");
      button.type = "button";
      button.className = "calendar-day";
      button.dataset.date = dateString;
      button.dataset.month = calendarMonthKey(date.getFullYear(), date.getMonth() + 1);
      button.classList.toggle("today", dateString === todayString);
      button.classList.toggle("selected", state.calendar.selectedDates.includes(dateString));
      button.setAttribute("aria-label", `${dateString}${courts ? `，${courts}个场` : ""}`);
      const number = document.createElement("span");
      number.className = "calendar-day-number";
      number.textContent = String(date.getDate());
      button.append(number);
      if (courts > 0) {
        const meta = document.createElement("span");
        meta.className = "calendar-day-meta";
        const badge = document.createElement("span");
        badge.className = "calendar-day-badge";
        badge.textContent = `${courts}场`;
        const session = daySessions[0];
        const venue = document.createElement("span");
        venue.className = `calendar-day-venue ${session.venue === "EDC" ? "venue-edc" : "venue-wenti"}`;
        venue.textContent = session.venue;
        venue.title = state.readOnly ? "只读模式下不能切换球馆" : `点击切换为${session.venue === "EDC" ? "文体" : "EDC"}`;
        venue.setAttribute("role", "button");
        venue.setAttribute("tabindex", "0");
        venue.setAttribute("aria-label", `${dateString}球馆：${session.venue}，点击切换`);
        venue.addEventListener("mousedown", (event) => event.stopPropagation());
        venue.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          void toggleSessionVenue(session);
        });
        venue.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          event.stopPropagation();
          void toggleSessionVenue(session);
        });
        meta.append(badge, venue);
        button.append(meta);
      }
      button.addEventListener("mousedown", (event) => {
        if (event.button !== 0) return;
        event.preventDefault();
        if (event.ctrlKey || event.metaKey) {
          toggleCalendarDate(dateString);
          return;
        }
        if (event.shiftKey) {
          const anchor = state.calendar.anchorDate || dateString;
          state.calendar.selectedDates = dateStringsBetween(anchor, dateString);
          state.calendar.anchorDate = anchor;
          refreshCalendarSelection();
          return;
        }
        state.calendar.dragStart = dateString;
        state.calendar.lastDragDate = dateString;
        state.calendar.dragActive = true;
        state.calendar.moved = false;
      });
      button.addEventListener("dblclick", () => {
        if (!daySessions.length) openChainForNewDate(dateString);
      });
      return button;
    }

    async function toggleSessionVenue(session) {
      if (state.readOnly) {
        toast("当前为只读模式，不能切换球馆");
        return;
      }
      const venue = session.venue === "EDC" ? "文体" : "EDC";
      setSync("正在切换球馆");
      try {
        const data = await api(`/api/sessions/${session.id}/venue`, {
          method: "PATCH",
          body: JSON.stringify({ venue }),
        });
        upsertSession(data.session);
        renderCalendar();
        setSync("已保存");
        toast(`已切换为${venue}`);
      } catch (error) {
        setSync("保存失败");
        toast(`切换球馆失败：${error.message}`);
      }
    }

    function getCalendarRangeStartDate(monthIndex) {
      const { year, month } = calendarMonthFromIndex(monthIndex);
      const first = new Date(year, month - 1, 1);
      first.setDate(first.getDate() - ((first.getDay() + 6) % 7));
      return first;
    }

    function getCalendarRangeEndDate(monthIndex) {
      const { year, month } = calendarMonthFromIndex(monthIndex);
      const last = new Date(year, month, 0);
      last.setDate(last.getDate() + ((7 - last.getDay()) % 7));
      return last;
    }

    function createCalendarDateRange(startIndex, endIndex) {
      const fragment = document.createDocumentFragment();
      const end = getCalendarRangeEndDate(endIndex);
      const current = getCalendarRangeStartDate(startIndex);
      while (current <= end) {
        fragment.append(createCalendarDayButton(new Date(current)));
        current.setDate(current.getDate() + 1);
      }
      return fragment;
    }

    function renderCalendar({ resetRange = false, preserveScroll = true } = {}) {
      const activeIndex = calendarMonthIndex(state.calendar.year, state.calendar.month);
      const previousScrollTop = els.calendarScroll.scrollTop;
      if (resetRange || state.calendar.rangeStart === null || state.calendar.rangeEnd === null) {
        state.calendar.rangeStart = activeIndex - CALENDAR_INITIAL_MONTHS_EACH_SIDE;
        state.calendar.rangeEnd = activeIndex + CALENDAR_INITIAL_MONTHS_EACH_SIDE;
      }
      els.calendarGrid.replaceChildren(createCalendarDateRange(state.calendar.rangeStart, state.calendar.rangeEnd));
      if (preserveScroll) els.calendarScroll.scrollTop = previousScrollTop;
      setCalendarActiveMonth(state.calendar.year, state.calendar.month, { refreshDetails: false });
      updateCalendarActiveMonthStyles();
      renderCalendarSelection();
      renderCalendarDayPanel();
    }

    function ensureCalendarMonthRendered(year, month) {
      const targetIndex = calendarMonthIndex(year, month);
      if (targetIndex >= state.calendar.rangeStart && targetIndex <= state.calendar.rangeEnd) return;
      state.calendar.rangeStart = targetIndex - CALENDAR_INITIAL_MONTHS_EACH_SIDE;
      state.calendar.rangeEnd = targetIndex + CALENDAR_INITIAL_MONTHS_EACH_SIDE;
      renderCalendar({ preserveScroll: false });
    }

    function scrollCalendarToMonth(year, month, behavior = "smooth") {
      const firstDay = els.calendarGrid.querySelector(`[data-month="${calendarMonthKey(year, month)}"]`);
      if (!firstDay) return;
      const scrollRect = els.calendarScroll.getBoundingClientRect();
      const dayRect = firstDay.getBoundingClientRect();
      const top = els.calendarScroll.scrollTop + dayRect.top - scrollRect.top;
      els.calendarScroll.scrollTo({ top, behavior });
    }

    function extendCalendarRangeIfNeeded() {
      const scroll = els.calendarScroll;
      if (!scroll.clientHeight) return;
      if (scroll.scrollTop < scroll.clientHeight * 0.75) {
        const oldHeight = scroll.scrollHeight;
        const oldScrollTop = scroll.scrollTop;
        const newStart = state.calendar.rangeStart - CALENDAR_RANGE_CHUNK;
        state.calendar.rangeStart = newStart;
        renderCalendar({ preserveScroll: false });
        scroll.scrollTop = oldScrollTop + scroll.scrollHeight - oldHeight;
      } else if (scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < scroll.clientHeight * 0.75) {
        const oldScrollTop = scroll.scrollTop;
        const newEnd = state.calendar.rangeEnd + CALENDAR_RANGE_CHUNK;
        state.calendar.rangeEnd = newEnd;
        renderCalendar({ preserveScroll: false });
        scroll.scrollTop = oldScrollTop;
      }
    }

    function syncCalendarMonthFromViewport() {
      const viewport = els.calendarScroll.getBoundingClientRect();
      const viewportCenter = viewport.top + viewport.height / 2;
      const monthScores = new Map();
      let best = null;
      els.calendarGrid.querySelectorAll(".calendar-day[data-month]").forEach((button) => {
        const rect = button.getBoundingClientRect();
        if (rect.bottom <= viewport.top || rect.top >= viewport.bottom) return;
        const width = Math.max(0, Math.min(rect.right, viewport.right) - Math.max(rect.left, viewport.left));
        const height = Math.max(0, Math.min(rect.bottom, viewport.bottom) - Math.max(rect.top, viewport.top));
        const visibleArea = width * height;
        if (!visibleArea) return;
        const current = monthScores.get(button.dataset.month) || { visibleArea: 0, weightedCenter: 0 };
        current.visibleArea += visibleArea;
        current.weightedCenter += visibleArea * (rect.top + rect.bottom) / 2;
        monthScores.set(button.dataset.month, current);
      });
      monthScores.forEach((score, key) => {
        const distance = Math.abs(score.weightedCenter / score.visibleArea - viewportCenter);
        if (!best || score.visibleArea > best.visibleArea + 1 || (Math.abs(score.visibleArea - best.visibleArea) <= 1 && distance < best.distance)) {
          best = { key, visibleArea: score.visibleArea, distance };
        }
      });
      if (!best) return;
      const { year, month } = parseCalendarMonthKey(best.key);
      setCalendarActiveMonth(year, month);
    }

    function handleCalendarScroll() {
      if (state.calendar.scrollRaf) return;
      state.calendar.scrollRaf = requestAnimationFrame(() => {
        state.calendar.scrollRaf = 0;
        extendCalendarRangeIfNeeded();
        syncCalendarMonthFromViewport();
      });
    }

    function renderCalendarSelection() {
      const selection = state.calendar.selectedDates;
      const sessions = getSessionsForSelection();
      const totalCourts = sessions.reduce((sum, session) => sum + session.courtCount, 0);
      const monthLabel = formatCalendarSummaryMonth(state.calendar.year, state.calendar.month);
      els.calendarSelectionText.textContent = selection.length
        ? `选中 ${selection.length} 天：${totalCourts} 个场`
        : `${monthLabel}：${totalCourts} 个场`;
    }

    function renderCalendarDayPanel() {
      const selection = state.calendar.selectedDates;
      const sessions = getSessionsForSelection();
      if (selection.length === 1) {
        const dateString = selection[0];
        els.calendarDayTitle.textContent = formatCalendarDate(dateString);
        if (!sessions.length) {
          const wrap = document.createElement("div");
          wrap.className = "empty-day-actions";
          const empty = document.createElement("div");
          empty.className = "empty-hint";
          empty.textContent = "当天没有订场记录";
          wrap.append(empty);
          if (!state.readOnly) {
            const addButton = document.createElement("button");
            addButton.type = "button";
            addButton.className = "primary-btn";
            addButton.textContent = "新增记录";
            addButton.addEventListener("click", () => openChainForNewDate(dateString));
            wrap.append(addButton);
          }
          els.calendarDayRecords.replaceChildren(wrap);
          return;
        }
        els.calendarDayRecords.replaceChildren(...sessions.map(createCalendarRecordCard));
        return;
      }
      const monthLabel = formatCalendarSummaryMonth(state.calendar.year, state.calendar.month);
      els.calendarDayTitle.textContent = selection.length ? `选中 ${selection.length} 天` : `${monthLabel}合计`;
      if (!sessions.length) {
        const empty = document.createElement("div");
        empty.className = "empty-hint";
        empty.textContent = selection.length ? "所选日期没有订场记录" : `${monthLabel}没有订场记录`;
        els.calendarDayRecords.replaceChildren(empty);
        return;
      }
      els.calendarDayRecords.replaceChildren(createAggregateCalendarCard(sessions));
    }

    function courtPriceBreakdown(session) {
      const count = Number(session.courtCount) || 0;
      const fee = Number(session.courtFee) || 0;
      if (count <= 0) return [];
      if (fee === 0) return [{ price: 0, count }];
      const average = fee / count;
      if (Math.abs(average - 70) < 1e-9) return [{ price: 70, count }];
      if (Math.abs(average - 80) < 1e-9) return [{ price: 80, count }];
      const count80 = (fee - 70 * count) / 10;
      if (Number.isInteger(count80) && count80 >= 0 && count80 <= count) {
        const parts = [];
        if (count - count80 > 0) parts.push({ price: 70, count: count - count80 });
        if (count80 > 0) parts.push({ price: 80, count: count80 });
        return parts;
      }
      return [{ fallback: true, total: fee, count }];
    }

    function buildCalendarSummaryLine(sessions) {
      const courtGroups = new Map();
      const shuttleGroups = new Map();
      const perPersonValues = [];
      let totalAmount = 0;

      for (const session of sessions) {
        const courtRows = session.courtPriceRows && session.courtPriceRows.length
          ? session.courtPriceRows
          : courtPriceBreakdown(session);
        for (const part of courtRows) {
          const key = part.fallback ? `f:${part.total}` : `p:${part.price}`;
          const current = courtGroups.get(key) || (
            part.fallback ? { fallback: true, total: 0, count: 0 } : { price: part.price, count: 0 }
          );
          current.count += part.count;
          if (part.fallback) current.total += part.total;
          courtGroups.set(key, current);
        }

        if (session.shuttlePriceRows && session.shuttlePriceRows.length) {
          for (const row of session.shuttlePriceRows) {
            shuttleGroups.set(row.price, (shuttleGroups.get(row.price) || 0) + row.count);
          }
        } else {
          const shuttleCount = Number(session.shuttleCount) || 0;
          if (shuttleCount > 0) {
            const price = Number(session.shuttlePrice) || 0;
            shuttleGroups.set(price, (shuttleGroups.get(price) || 0) + shuttleCount);
          }
        }

        const amounts = (session.players || []).reduce((sum, row) => sum + row.amount, 0);
        const slots = (session.players || []).reduce((sum, row) => sum + (row.slots > 0 ? row.slots : 0), 0);
        totalAmount += amounts;
        if (slots > 0) perPersonValues.push(amounts / slots);
      }

      const courtParts = [...courtGroups.values()]
        .sort((a, b) => (a.fallback ? Number.POSITIVE_INFINITY : a.price) - (b.fallback ? Number.POSITIVE_INFINITY : b.price))
        .map((part) => part.fallback
          ? `共${formatMoney(part.total)}元（${part.count}个场）`
          : `${formatCompactNumber(part.price)}元×${part.count}个`);
      const shuttleParts = [...shuttleGroups.entries()]
        .sort((a, b) => a[0] - b[0])
        .map(([price, count]) => `${formatCompactNumber(price)}元×${count}个`);

      const separator = courtParts.length + shuttleParts.length <= 2 ? "，" : "；";
      const average = perPersonValues.length
        ? perPersonValues.reduce((sum, value) => sum + value, 0) / perPersonValues.length
        : 0;

      let line = `场地 ${courtParts.join("、") || "0元×0个"}`;
      if (shuttleParts.length) line += `${separator}球 ${shuttleParts.join("、")}`;
      line += `${separator}共${formatMoney(totalAmount)}元，平均${formatMoney(average)}元/人次。`;
      return line;
    }

    function createAggregateCalendarCard(sessions) {
      const card = document.createElement("div");
      card.className = "calendar-record";
      const head = document.createElement("div");
      head.className = "calendar-record-head";

      const titleWrap = document.createElement("div");
      const memberMap = new Map();
      for (const session of sessions) {
        for (const row of session.players) {
          const key = row.playerId !== null && row.playerId !== undefined
            ? `p:${row.playerId}`
            : `n:${row.playerName}`;
          const current = memberMap.get(key) || { name: row.playerName || "未知成员", amount: 0 };
          current.amount += row.amount;
          memberMap.set(key, current);
        }
      }

      const meta = document.createElement("div");
      meta.className = "calendar-record-meta";
      meta.textContent = buildCalendarSummaryLine(sessions);
      titleWrap.append(meta);
      head.append(titleWrap);
      card.append(head);

      const players = document.createElement("div");
      players.className = "calendar-record-players";
      const members = [...memberMap.values()].sort((a, b) => (
        (b.amount - a.amount) || collator.compare(a.name, b.name)
      ));
      players.append(...members.map((member) => {
        const span = document.createElement("span");
        span.className = "calendar-record-player";
        span.textContent = `${member.name}（${formatMoney(member.amount)}元）`;
        return span;
      }));
      card.append(players);
      return card;
    }

    function buildChainInputFromSession(session) {
      const lines = [];
      const plusOverrides = {};
      const identityCounts = new Map();
      const appendLine = (line, snapshot = null) => {
        const identity = normalizeAlias(cleanChainLine(line));
        const occurrence = identityCounts.get(identity) || 0;
        identityCounts.set(identity, occurrence + 1);
        lines.push(line);
        if (snapshot) plusOverrides[`${identity}::${occurrence}`] = snapshot;
      };
      for (const row of session.players) {
        const name = row.playerName || "未知成员";
        if (row.playerId === null && /[+＋➕]\s*\d+/.test(name)) {
          appendLine(name, {
            gender: row.gender || (row.isFemale ? "女" : "不详"),
            levelText: row.level || "不详",
            levelGroupLabel: getLevelGroupLabel(row.level),
          });
          continue;
        }
        if (row.slots <= 1) {
          appendLine(row.isFemale ? `${name}🌸` : name);
        } else {
          appendLine(name);
          for (let i = 1; i < row.slots; i++) appendLine(`${name}+${i}`);
        }
      }
      return { text: lines.join("\n"), plusOverrides };
    }

    function createXlsx(rows) {
      const sheetRows = rows.map((row, rowIndex) => {
        const cells = row.map((value, colIndex) => {
          const ref = `${columnLetter(colIndex + 1)}${rowIndex + 1}`;
          return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${escapeXml(String(value ?? ""))}</t></is></c>`;
        }).join("");
        return `<row r="${rowIndex + 1}">${cells}</row>`;
      }).join("");
      const colCount = Math.max(1, rows[0]?.length || 1);
      const rowCount = Math.max(1, rows.length);
      const dimension = `A1:${columnLetter(colCount)}${rowCount}`;
      const worksheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><dimension ref="${dimension}"/><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="18"/><sheetData>${sheetRows}</sheetData></worksheet>`;

      const files = [
        { name: "[Content_Types].xml", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>` },
        { name: "_rels/.rels", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
        { name: "xl/workbook.xml", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="羽球助手" sheetId="1" r:id="rId1"/></sheets></workbook>` },
        { name: "xl/_rels/workbook.xml.rels", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>` },
        { name: "xl/worksheets/sheet1.xml", content: worksheet },
      ];
      return zipStore(files);
    }

    function zipStore(files) {
      const encoder = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      let offset = 0;
      const { dosTime, dosDate } = getDosTimeDate(new Date());

      for (const file of files) {
        const nameBytes = encoder.encode(file.name);
        const data = encoder.encode(file.content);
        const crc = crc32(data);
        const local = new Uint8Array(30 + nameBytes.length);
        const localView = new DataView(local.buffer);
        localView.setUint32(0, 0x04034b50, true);
        localView.setUint16(4, 20, true);
        localView.setUint16(6, 0x0800, true);
        localView.setUint16(8, 0, true);
        localView.setUint16(10, dosTime, true);
        localView.setUint16(12, dosDate, true);
        localView.setUint32(14, crc, true);
        localView.setUint32(18, data.length, true);
        localView.setUint32(22, data.length, true);
        localView.setUint16(26, nameBytes.length, true);
        local.set(nameBytes, 30);
        localParts.push(local, data);

        const central = new Uint8Array(46 + nameBytes.length);
        const centralView = new DataView(central.buffer);
        centralView.setUint32(0, 0x02014b50, true);
        centralView.setUint16(4, 20, true);
        centralView.setUint16(6, 20, true);
        centralView.setUint16(8, 0x0800, true);
        centralView.setUint16(10, 0, true);
        centralView.setUint16(12, dosTime, true);
        centralView.setUint16(14, dosDate, true);
        centralView.setUint32(16, crc, true);
        centralView.setUint32(20, data.length, true);
        centralView.setUint32(24, data.length, true);
        centralView.setUint16(28, nameBytes.length, true);
        centralView.setUint32(42, offset, true);
        central.set(nameBytes, 46);
        centralParts.push(central);
        offset += local.length + data.length;
      }

      const centralOffset = offset;
      const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
      const end = new Uint8Array(22);
      const endView = new DataView(end.buffer);
      endView.setUint32(0, 0x06054b50, true);
      endView.setUint16(8, files.length, true);
      endView.setUint16(10, files.length, true);
      endView.setUint32(12, centralSize, true);
      endView.setUint32(16, centralOffset, true);
      return concatUint8([...localParts, ...centralParts, end]);
    }

    function findShuttleTypeByPrice(price) {
      if (!Number.isFinite(price)) return null;
      return (state.estimator?.shuttleTypes || DEFAULT_ESTIMATOR.shuttleTypes).find((type) => (
        Array.isArray(type.prices) && type.prices.some((knownPrice) => Math.abs(Number(knownPrice) - price) < 0.02)
      )) || null;
    }

    function estimatorEntryWeight(entry, model) {
      const fallbackLevel = Number(state.estimator?.training?.fallbackLevel) || DEFAULT_ESTIMATOR.training.fallbackLevel;
      const parsedLevel = levelRank(entry.levelText);
      const level = parsedLevel < 0 ? fallbackLevel : parsedLevel;
      const unknownMaleProbability = Number(state.estimator?.training?.unknownMaleProbability);
      const genderLoad = entry.gender === "男"
        ? 1
        : entry.gender === "不详"
          ? (Number.isFinite(unknownMaleProbability) ? unknownMaleProbability : 0.5)
          : 0;
      return Math.max(0.4, 1
        + (Number(model.levelSlope) || 0) * (level - fallbackLevel)
        + (Number(model.maleBonus) || 0) * genderLoad);
    }

    function estimateBooking(entries) {
      if (!entries.length) return { courts: 0, rsl3: 0, as05: 0, rsl3Equivalent: 0 };
      const estimator = state.estimator || DEFAULT_ESTIMATOR;
      const courtModel = estimator.court || DEFAULT_ESTIMATOR.court;
      const shuttleModel = estimator.shuttle || DEFAULT_ESTIMATOR.shuttle;
      const sumLoad = (model) => entries.reduce((sum, entry) => sum + estimatorEntryWeight(entry, model), 0);
      const sumMemberAdjustments = (model) => entries.reduce((sum, entry) => {
        const playerId = entry.player?.id;
        return sum + (playerId ? Number(model.memberAdjustments?.[String(playerId)]) || 0 : 0);
      }, 0);

      const courtRaw = (Number(courtModel.intercept) || 0)
        + (Number(courtModel.slope) || 0) * sumLoad(courtModel)
        + sumMemberAdjustments(courtModel);
      const courts = Math.max(1, Math.ceil(courtRaw - (Number(courtModel.roundingOffset) || 0)));

      const shuttleRaw = (Number(shuttleModel.intercept) || 0)
        + (Number(shuttleModel.slope) || 0) * sumLoad(shuttleModel)
        + sumMemberAdjustments(shuttleModel);
      const rsl3Equivalent = Math.max(1, shuttleRaw);
      const rsl3Type = estimator.shuttleTypes.find((type) => type.id === "rsl3") || { durability: 1 };
      const as05Type = estimator.shuttleTypes.find((type) => type.id === "as05") || { durability: 1.2 };
      return {
        courts,
        rsl3Equivalent,
        rsl3: Math.max(1, Math.ceil(rsl3Equivalent / (Number(rsl3Type.durability) || 1))),
        as05: Math.max(1, Math.ceil(rsl3Equivalent / (Number(as05Type.durability) || 1.2))),
      };
    }

    function predictedShuttleCountForPrice(estimate, price) {
      const type = findShuttleTypeByPrice(price);
      if (!type || !estimate) return null;
      if (type.id === "rsl3") return estimate.rsl3;
      if (type.id === "as05") return estimate.as05;
      return Math.max(1, Math.ceil(estimate.rsl3Equivalent / (Number(type.durability) || 1)));
    }

    function updateShuttleTypeNotice() {

      const unknown = price !== null && Number.isFinite(price) && !findShuttleTypeByPrice(price);
      els.shuttleTypeNotice.hidden = !unknown;
      els.shuttleTypeNotice.textContent = unknown ? "未登记球型号，请先记录" : "";

    function getDefaultCourtCount(peopleCount) {
      if (peopleCount <= 9) return 1;
      if (peopleCount <= 14) return 2;
      if (peopleCount <= 21) return 3;
      if (peopleCount <= 28) return 4;
      if (peopleCount <= 35) return 5;
      if (peopleCount <= 42) return 6;
      return 6 + Math.ceil((peopleCount - 42) / 7);
    }

    function deriveCourtRows(fee, count) {
      const breakdown = courtPriceBreakdown({ courtCount: count, courtFee: fee });
      if (breakdown.length && !breakdown[0].fallback) return breakdown;
      return [];
    }

    function createPriceRowElement(row, { isLast, onlyRow, onAdd, onRemove, onChanged }) {
      const div = document.createElement("div");
      div.className = "fee-advanced-row";

      const priceInput = document.createElement("input");
      priceInput.type = "number";
      priceInput.min = "0";
      priceInput.step = "any";

      const countInput = document.createElement("input");
      countInput.type = "number";
      countInput.min = "0";
      countInput.step = "1";
      countInput.inputMode = "numeric";
      countInput.value = String(row.count);

      const addButton = document.createElement("button");
      addButton.type = "button";
      addButton.className = "fee-advanced-add";
      addButton.textContent = "+";
      addButton.title = "添加一行";

      const removeButton = document.createElement("button");
      removeButton.type = "button";
      removeButton.className = "fee-advanced-remove";
      removeButton.textContent = "×";
      removeButton.title = "删除这一行";

      priceInput.addEventListener("input", () => {
        row.price = Number(priceInput.value) || 0;
        onChanged?.();
      });
      countInput.addEventListener("input", () => {
        row.count = Math.max(0, Math.floor(Number(countInput.value) || 0));
        onChanged?.();
      });
      addButton.addEventListener("click", onAdd);
      removeButton.addEventListener("click", onRemove);

      if (!isLast) addButton.hidden = true;
      if (onlyRow) removeButton.disabled = true;

      div.append(priceInput, times, countInput, addButton, removeButton);
      return div;
    }

    function renderPriceRows(container, rows, onChanged) {
      container.replaceChildren(...rows.map((row, index) => createPriceRowElement(row, {
        isLast: index === rows.length - 1,
        onlyRow: rows.length === 1,
        onAdd: () => {
          rows.push({ price: 0, count: 1 });
          renderPriceRows(container, rows, onChanged);
          onChanged?.();
        },
        onRemove: () => {
          if (rows.length <= 1) return;
          rows.splice(index, 1);
          renderPriceRows(container, rows, onChanged);
          onChanged?.();
        },
        onChanged,
      })));
    }
