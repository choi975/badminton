    function getAdvancedTotals() {
      const courtRows = state.advancedRows.court.filter((row) => row.count > 0);
      const shuttleRows = state.advancedRows.shuttle.filter((row) => row.count > 0);
      const courtFee = courtRows.reduce((sum, row) => sum + row.price * row.count, 0);
      const courtCount = courtRows.reduce((sum, row) => sum + row.count, 0);
      const shuttleCount = shuttleRows.reduce((sum, row) => sum + row.count, 0);
      const shuttleCost = shuttleRows.reduce((sum, row) => sum + row.price * row.count, 0);
      return {
        courtFee,
        courtCount,
        shuttleCount,
        shuttleCost,
        shuttlePrice: shuttleCount ? shuttleCost / shuttleCount : 0,
        courtRows,
        shuttleRows,
      };
    }

    function toggleFeeMode() {
      if (state.feeMode === "basic") enterAdvancedFeeMode();
      else exitAdvancedFeeMode();
    }

    function enterAdvancedFeeMode() {
      const estimate = estimateBooking(state.chainEntries);
      const courts = estimate.courts || 1;
      const currentFee = Number(els.courtFeeInput.value) || 0;
      const breakdown = courtPriceBreakdown({ courtCount: courts, courtFee: currentFee });
      const courtRows = breakdown.length && !breakdown[0].fallback
        ? breakdown
        : [{ price: courts ? currentFee / courts : 0, count: courts || 1 }];
      const shuttleCount = Math.max(0, Math.floor(Number(els.shuttleCountInput.value) || 0));
      const shuttleRows = [{ price: Number(els.shuttlePriceInput.value) || 0, count: shuttleCount }];

      state.advancedRows = { court: courtRows, shuttle: shuttleRows };
      state.feeMode = "advanced";
      state.advancedAutoDefaults = null;
      els.feeBasicGrid.hidden = true;
      els.feeAdvancedArea.hidden = false;
      els.feeAdvancedBtn.textContent = "基础";
      renderAllFeeAdvancedRows();
      updatePaymentButton();
    }

    function exitAdvancedFeeMode() {
      const totals = getAdvancedTotals();
      els.courtFeeInput.value = formatCompactNumber(totals.courtFee);
      els.shuttlePriceInput.value = formatCompactNumber(totals.shuttlePrice);
      els.shuttleCountInput.value = String(totals.shuttleCount);
      const estimate = estimateBooking(state.chainEntries);
      const courts = estimate.courts || 1;
      const predictedShuttle = predictedShuttleCountForPrice(estimate, totals.shuttlePrice);
      const matchesDefault = Math.abs(totals.courtFee - courts * 70) < 1e-9
        && predictedShuttle !== null
        && totals.shuttleCount === predictedShuttle;
      state.autoFeeDefaults = matchesDefault
        ? { fee: courts * 70, shuttle: predictedShuttle, courts }
        : null;
      state.feeMode = "basic";
      state.advancedRows = { court: [], shuttle: [] };
      els.feeAdvancedArea.hidden = true;
      els.feeBasicGrid.hidden = false;
      els.feeAdvancedBtn.textContent = "高级";
      updatePaymentButton();
    }

    function updateFeeDefaults(entries, estimate) {
      updateShuttleTypeNotice();
      if (!entries.length || !estimate?.courts) return;
      const currentShuttlePrice = Number(els.shuttlePriceInput.value);
      const defaultShuttleCount = predictedShuttleCountForPrice(estimate, currentShuttlePrice);
      if (state.feeMode === "advanced") {
        const courts = estimate.courts;
        const previous = state.advancedAutoDefaults;
        const courtRows = state.advancedRows.court;
        const shuttleRows = state.advancedRows.shuttle;
        if (previous && courtRows.length) {
          const first = courtRows[0];
          if (first.price === 70 && first.count === previous.courts) {
            first.count = courts;
          }
        }
        if (previous && shuttleRows.length && defaultShuttleCount !== null) {
          const first = shuttleRows[0];
          if (first.count === previous.shuttleCount) {
            first.count = defaultShuttleCount;
          }
        }
        state.advancedAutoDefaults = { courts, shuttleCount: defaultShuttleCount };
        renderAllFeeAdvancedRows();
        updatePaymentButton();
        return;
      }
      const courts = estimate.courts;
      const previous = state.autoFeeDefaults;

      const currentFeeRaw = els.courtFeeInput.value.trim();
      const currentShuttleRaw = els.shuttleCountInput.value.trim();
      const currentFee = currentFeeRaw === "" ? null : Number(currentFeeRaw);
      const currentShuttle = currentShuttleRaw === "" ? null : Number(currentShuttleRaw);

      const previousCourtUnit = previous?.courts > 0 ? previous.fee / previous.courts : 70;
      const courtUnit = Number.isFinite(previousCourtUnit) ? previousCourtUnit : 70;
      const newFee = courts * courtUnit;

      const feeIsAuto = currentFee === null || (previous !== null && currentFee === previous.fee);
      const shuttleIsAuto = currentShuttle === null || (previous !== null && currentShuttle === previous.shuttle);

      if (feeIsAuto) {
        els.courtFeeInput.value = String(newFee);
        els.courtFeeInput.dataset.defaultValue = String(newFee);
      }
      if (shuttleIsAuto && defaultShuttleCount !== null) {
        els.shuttleCountInput.value = String(defaultShuttleCount);
        els.shuttleCountInput.dataset.defaultValue = String(defaultShuttleCount);
      }

      state.autoFeeDefaults = {
        fee: newFee,
        shuttle: defaultShuttleCount ?? previous?.shuttle ?? currentShuttle,
        courts,
      };
    }

    function processChain() {
      const aliasIndex = buildAliasIndex();
      const identityCounts = new Map();
      const entries = getChainInputLines(els.chainInput.value)
        .map((line, index) => {
          const identity = normalizeAlias(cleanChainLine(line));
          const occurrence = identityCounts.get(identity) || 0;
          identityCounts.set(identity, occurrence + 1);
          const overrideKey = `${identity}::${occurrence}`;
          return parseChainLine(line, index, aliasIndex, overrideKey, state.plusOverrides[overrideKey]);
        })
        .filter((entry) => entry.clean);
      const activePlusKeys = new Set(entries.filter((entry) => entry.plusEntry).map((entry) => entry.overrideKey));
      Object.keys(state.plusOverrides).forEach((key) => {
        if (!activePlusKeys.has(key)) delete state.plusOverrides[key];
      });
      const sorted = [...entries].sort((a, b) => (b.sortRank - a.sortRank) || (a.index - b.index));
      state.chainEntries = entries;
      const estimate = estimateBooking(entries);
      renderChainOutput(sorted);
      renderChainStats(sorted, estimate);
      updateFeeDefaults(entries, estimate);
      updatePaymentButton();
    }

    function toggleChainLevelMode() {
      state.chainLevelMode = state.chainLevelMode === "exact" ? "group" : "exact";
      renderChainLevelModeButton();
      processChain();
    }

    function renderChainLevelModeButton() {
      const grouped = state.chainLevelMode === "group";
      els.levelDisplayModeBtn.textContent = grouped ? "⇄ 分组" : "⇄ 等级";
      els.levelDisplayModeBtn.classList.toggle("active", grouped);
      els.levelDisplayModeBtn.setAttribute("aria-pressed", String(grouped));
      els.levelDisplayModeBtn.title = grouped
        ? "当前为分组显示，点击切换为精确等级"
        : "当前为精确等级，点击切换为分组显示";
    }

    function getChainLevelDisplay(entry) {
      return state.chainLevelMode === "group"
        ? (entry.levelGroupLabel || getLevelGroupLabel(entry.levelText))
        : entry.levelText;
    }

    function getLevelGroupLabel(level) {
      if (!level || level === "不详" || level === "等级不详") return "不详";
      const rank = levelRank(level);
      if (rank >= 0.5 && rank <= 2) return "新手";
      if (rank >= 2.5 && rank <= 3.5) return "中手";
      if (rank >= 4 && rank <= 5) return "高手";
      if (rank >= 6 && rank <= 9) return "比赛级高手";
      return "不详";
    }

    function parseChainLine(line, index, aliasIndex, overrideKey = "", override = null) {
      const plusMetadata = parsePlusEntryMetadata(cleanChainLine(line));
      const clean = plusMetadata.displayName;
      const matchedPlayer = findPlayerForLine(clean, aliasIndex);
      const player = plusMetadata.plusEntry ? null : matchedPlayer;
      const knownLevel = player?.level || "不详";
      const detectedLevelText = plusMetadata.plusEntry ? plusMetadata.levelText : knownLevel;
      const detectedGender = plusMetadata.plusEntry
        ? (plusMetadata.isFemale ? "女" : "不详")
        : (player?.gender === "女" ? "女" : "男");
      const levelText = plusMetadata.plusEntry && override?.levelText ? override.levelText : detectedLevelText;
      const detectedLevelGroupLabel = plusMetadata.plusEntry ? plusMetadata.levelGroupLabel : null;
      const levelGroupLabel = plusMetadata.plusEntry && override?.levelGroupLabel
        ? override.levelGroupLabel
        : detectedLevelGroupLabel;
      const overrideGender = plusMetadata.plusEntry
        ? (typeof override?.gender === "string"
          ? override.gender
          : typeof override?.isFemale === "boolean"
            ? (override.isFemale ? "女" : "男")
            : null)
        : null;
      const gender = overrideGender || detectedGender;
      const isFemale = gender === "女";
      return {
        index,
        raw: line,
        clean,
        player,
        plusEntry: plusMetadata.plusEntry,
        overrideKey,
        detectedLevelText,
        detectedLevelGroupLabel,
        detectedGender,
        gender,
        levelText,
        levelGroupLabel,
        isFemale,
        sortRank: levelRank(levelText),
      };
    }

    function getChainEntryBaseName(entry) {
      const name = String(entry?.clean || "");
      return entry?.plusEntry ? name.replace(/🌸/g, " ").replace(/\s+/g, " ").trim() : name;
    }

    function getChainEntryDisplayName(entry) {
      const name = getChainEntryBaseName(entry);
      if (!entry?.isFemale || name.includes("🌸")) return name;
      return `${name}🌸`;
    }

    function formatChainOutputLine(entry, index) {
      return `${index + 1}. ${getChainEntryDisplayName(entry)}（${getChainLevelDisplay(entry)}）`;
    }

    function renderChainOutput(entries) {
      els.chainOutput.replaceChildren(...entries.map((entry, index) => {
        const row = document.createElement("div");
        row.className = "chain-output-row";
        row.setAttribute("role", "listitem");

        const text = document.createElement("span");
        text.className = "chain-output-text";
        text.textContent = formatChainOutputLine(entry, index);
        row.append(text);

        if (entry.plusEntry) row.append(createInlinePlusControls(entry));
        return row;
      }));
    }

    function createInlinePlusControls(entry) {
      const controls = document.createElement("div");
      controls.className = "inline-plus-controls";

      const genderChoice = document.createElement("div");
      genderChoice.className = "inline-gender-choice";
      genderChoice.setAttribute("role", "group");
      genderChoice.setAttribute("aria-label", `${getChainEntryBaseName(entry)}的性别`);

      const maleButton = document.createElement("button");
      maleButton.type = "button";
      maleButton.textContent = "男";
      maleButton.classList.toggle("active", entry.gender === "男");
      maleButton.setAttribute("aria-pressed", String(entry.gender === "男"));
      maleButton.addEventListener("click", () => setInlinePlusGender(entry.overrideKey, "男"));

      const femaleButton = document.createElement("button");
      femaleButton.type = "button";
      femaleButton.textContent = "女🌸";
      femaleButton.classList.toggle("active", entry.gender === "女");
      femaleButton.setAttribute("aria-pressed", String(entry.gender === "女"));
      femaleButton.addEventListener("click", () => setInlinePlusGender(entry.overrideKey, "女"));

      const unknownButton = document.createElement("button");
      unknownButton.type = "button";
      unknownButton.textContent = "性别不详";
      unknownButton.classList.toggle("active", entry.gender === "不详");
      unknownButton.setAttribute("aria-pressed", String(entry.gender === "不详"));
      unknownButton.addEventListener("click", () => setInlinePlusGender(entry.overrideKey, "不详"));
      genderChoice.append(maleButton, femaleButton, unknownButton);

      const levelSelect = document.createElement("select");
      levelSelect.className = "inline-level-select";
      levelSelect.setAttribute("aria-label", `${getChainEntryBaseName(entry)}的水平`);
      levelSelect.replaceChildren(...getInlinePlusLevelOptions().map((option) => {
        const element = document.createElement("option");
        element.value = option.label;
        element.textContent = option.text;
        return element;
      }));
      levelSelect.value = getInlinePlusLevelLabel(entry);
      levelSelect.addEventListener("change", () => setInlinePlusLevel(entry.overrideKey, levelSelect.value));

      controls.append(genderChoice, levelSelect);
      return controls;
    }

    function getInlinePlusLevelOptions() {
      if (state.chainLevelMode === "group") return PLUS_GROUP_LEVEL_OPTIONS;
      return [
        { label: "不详", level: "不详", text: "等级不详" },
        ...LEVELS.filter((level) => level !== "不详").map((level) => ({ label: level, level, text: level })),
      ];
    }

    function getInlinePlusLevelLabel(entry) {
      const options = getInlinePlusLevelOptions();
      const currentLabel = state.chainLevelMode === "group"
        ? (entry.levelGroupLabel || getLevelGroupLabel(entry.levelText))
        : entry.levelText;
      const option = options.find((item) => item.label === currentLabel || item.level === currentLabel);
      return option?.label || "不详";
    }

    function setInlinePlusGender(overrideKey, gender) {
      const entry = state.chainEntries.find((item) => item.overrideKey === overrideKey);
      if (!entry) return;
      state.plusOverrides[overrideKey] = {
        levelText: entry.levelText,
        levelGroupLabel: entry.levelGroupLabel,
        gender,
      };
      processChain();
    }

    function setInlinePlusLevel(overrideKey, label) {
      const entry = state.chainEntries.find((item) => item.overrideKey === overrideKey);
      const option = getInlinePlusLevelOptions().find((item) => item.label === label);
      if (!entry || !option) return;
      state.plusOverrides[overrideKey] = {
        levelText: option.level,
        levelGroupLabel: getLevelGroupLabel(option.level),
        gender: entry.gender,
      };
      processChain();
    }

    function parsePlusEntryMetadata(value) {
      const displayName = String(value || "");
      const plusMatch = displayName.match(/[+＋➕]\s*\d+/);
      if (!plusMatch) return { plusEntry: false, displayName, levelText: null, isFemale: false };

      const suffixStart = (plusMatch.index || 0) + plusMatch[0].length;
      const suffix = displayName.slice(suffixStart);
      const levelMapping = PLUS_LEVEL_LABELS.find(([label]) => suffix.includes(label));
      let cleanedDisplayName = displayName;

      if (levelMapping) {
        const labelIndex = suffix.indexOf(levelMapping[0]);
        const absoluteIndex = suffixStart + labelIndex;
        cleanedDisplayName = `${displayName.slice(0, absoluteIndex)}${displayName.slice(absoluteIndex + levelMapping[0].length)}`.trim();
      }

      return {
        plusEntry: true,
        displayName: cleanedDisplayName,
        levelText: levelMapping?.[1] || "不详",
        levelGroupLabel: levelMapping?.[0] || "不详",
        isFemale: suffix.includes("🌸"),
      };
    }

    function renderChainStats(entries, estimate) {
      if (!entries.length) {
        els.chainStats.replaceChildren();
        return;
      }

      const levelLines = state.chainLevelMode === "group"
        ? buildGroupedLevelStats(entries)
        : buildExactLevelStats(entries);
      const genderCounts = { 男: 0, 女: 0, 不详: 0 };
      for (const entry of entries) {
        const gender = entry.gender === "女" ? "女" : entry.gender === "不详" ? "不详" : "男";
        genderCounts[gender] += 1;
      }
      const genderLabels = { 男: "男生", 女: "女生", 不详: "性别不详" };
      const genderLines = ["男", "女", "不详"]
        .filter((gender) => genderCounts[gender] > 0)
        .map((gender) => `${genderLabels[gender]}：${genderCounts[gender]}人`);

      const levelStats = document.createElement("div");
      levelStats.textContent = levelLines.join("\n");

      const divider = document.createElement("div");
      divider.className = "stats-divider";
      divider.setAttribute("role", "separator");

      const genderStats = document.createElement("div");
      genderStats.textContent = genderLines.join("\n");

      const estimateDivider = document.createElement("div");
      estimateDivider.className = "stats-divider";
      estimateDivider.setAttribute("role", "separator");

      const estimateLine = document.createElement("div");
      estimateLine.className = "estimate-line";
      estimateLine.textContent = `预计需要 ${estimate.courts} 个场地 和 ${estimate.rsl3} 颗亚3或 ${estimate.as05} 颗AS05`;

      els.chainStats.replaceChildren(levelStats, divider, genderStats, estimateDivider, estimateLine);
    }

    function buildExactLevelStats(entries) {
      const counts = new Map();
      for (const entry of entries) counts.set(entry.levelText, (counts.get(entry.levelText) || 0) + 1);
      return [...counts.entries()]
        .sort((a, b) => (levelRank(b[0]) - levelRank(a[0])) || collator.compare(a[0], b[0]))
        .map(([level, count]) => `${level === "不详" ? "等级不详" : level}：${count}人`);
    }

    function buildGroupedLevelStats(entries) {
      const counts = new Map();
      for (const entry of entries) {
        const group = entry.levelGroupLabel || getLevelGroupLabel(entry.levelText);
        counts.set(group, (counts.get(group) || 0) + 1);
      }
      return ["比赛级高手", "高手", "中手", "新手", "不详"]
        .filter((group) => counts.has(group))
        .map((group) => `${group}：${counts.get(group)}人`);
    }

    function updatePaymentButton() {
      if (state.feeMode === "advanced") {
        const totals = getAdvancedTotals();
        const hasShuttleRow = state.advancedRows.shuttle.length > 0;
        els.paymentBtn.disabled = !(els.chainInput.value.trim() && totals.courtCount > 0 && hasShuttleRow);
        return;
      }
      const ready = Boolean(
        els.chainInput.value.trim() &&
        els.courtFeeInput.value.trim() &&
        els.shuttlePriceInput.value.trim() &&
        els.shuttleCountInput.value.trim()
      );
      els.paymentBtn.disabled = !ready;
    }

    function togglePaymentSortMode(affiliation) {
      state.paymentSortModes[affiliation] = state.paymentSortModes[affiliation] === "chain" ? "join" : "chain";
      renderPaymentSortButtons();
      if (els.paymentModal.classList.contains("open")) openPaymentModal();
    }

    function togglePaymentGroup(playerId, currentGroup, kind) {
      const id = Number(playerId);
      if (kind === "dual") {
        state.paymentGroupOverrides[id] = currentGroup === "friends" ? "Hytronik" : "球友";
      } else {
        state.paymentGroupOverrides[id] = currentGroup === "heineken" ? "特殊" : "Hytronik";
      }
      if (els.paymentModal.classList.contains("open")) openPaymentModal();
    }

    function renderPaymentSortButtons() {
      const render = (button, affiliation) => {
        const chainMode = state.paymentSortModes[affiliation] === "chain";
        button.textContent = chainMode ? "⇅ 接龙顺序" : "⇅ 入群顺序";
        button.title = chainMode
          ? `当前按接龙顺序排序，点击切换为入群顺序`
          : `当前按入群顺序排序，点击切换为接龙顺序`;
        button.setAttribute("aria-pressed", String(chainMode));
      };
      render(els.paymentFriendsSortBtn, "球友");
      render(els.paymentHeinekenSortBtn, "Hytronik");
    }

    function renderPaymentCostSummary(courtFee, courtRows, shuttleRows, shuttleCost, payerCount, femaleCount, maleCount, femaleCapApplied) {
      const courtParts = courtRows.length
        ? courtRows.map((row) => `${formatCompactNumber(row.price)}元*${row.count}个`).join("+")
        : "";
      const shuttleParts = shuttleRows.length
        ? shuttleRows.map((row) => `${formatCompactNumber(row.price)}元*${row.count}个`).join("+")
        : "";
      const courtText = courtParts
        ? `${courtParts}=${formatCompactNumber(courtFee)}元`
        : `${formatCompactNumber(courtFee)}元`;
      const shuttleText = shuttleParts
        ? `${shuttleParts}=${formatCompactNumber(shuttleCost)}元`
        : `${formatCompactNumber(shuttleCost)}元`;
      const totalCost = courtFee + shuttleCost;
      const perPerson = payerCount > 0 ? totalCost / payerCount : 0;
      const lines = [
        { label: "场地费", text: courtText },
        { label: "球费", text: shuttleText },
      ];
      if (femaleCapApplied && femaleCount > 0 && maleCount > 0) {
        const malePerPerson = ceilOneDecimal((totalCost - FEMALE_PAYMENT_CAP * femaleCount) / maleCount);
        lines.push({ label: "女性", text: `${FEMALE_PAYMENT_CAP}元` });
        lines.push({
          label: "男性",
          text: `（${formatCompactNumber(courtFee)} + ${formatCompactNumber(shuttleCost)} - ${FEMALE_PAYMENT_CAP}*${femaleCount}）/ ${maleCount} ≈ ${formatMoney(malePerPerson)}元`,
        });
      } else {
        const roundedPerPerson = ceilOneDecimal(perPerson);
        lines.push({
          label: "人均",
          text: payerCount > 0
            ? `（${formatCompactNumber(courtFee)} + ${formatCompactNumber(shuttleCost)}）/ ${payerCount} ≈ ${formatMoney(roundedPerPerson)}元`
            : "（...）/ 0 ≈ -",
        });
      }
      els.paymentCostSummary.replaceChildren(...lines.map((row) => {
        const div = document.createElement("div");
        div.className = "payment-cost-row";
        const span = document.createElement("span");
        span.textContent = row.label;
        const strong = document.createElement("strong");
        strong.textContent = row.text;
        div.append(span, strong);
        return div;
      }));
    }

    function openPaymentModal() {
      processChain();
      const advanced = state.feeMode === "advanced";
      let courtFee;
      let shuttlePrice;
      let shuttleCount;
      let shuttleCost = 0;
      let courtCount = null;
      let courtRows = [];
      let shuttleRows = [];

      if (advanced) {
        const totals = getAdvancedTotals();
        if (totals.courtCount <= 0) {
          toast("请至少填写一行有效的场地个数");
          return;
        }
        courtFee = totals.courtFee;
        shuttlePrice = totals.shuttlePrice;
        shuttleCount = totals.shuttleCount;
        shuttleCost = totals.shuttleCost;
        courtCount = totals.courtCount;
        courtRows = totals.courtRows;
        shuttleRows = totals.shuttleRows;
      } else {
        courtFee = Number(els.courtFeeInput.value);
        shuttlePrice = Number(els.shuttlePriceInput.value);
        shuttleCount = Number(els.shuttleCountInput.value);
        if (![courtFee, shuttlePrice, shuttleCount].every(Number.isFinite)) {
          toast("费用和球数需要填写数字");
          return;
        }
        const candidates = inferCourtCounts(courtFee);
        if (candidates.length === 1) {
          courtCount = candidates[0];
          courtRows = deriveCourtRows(courtFee, courtCount);
        }
        if (shuttleCount > 0) shuttleRows = [{ price: shuttlePrice, count: shuttleCount }];
        shuttleCost = shuttlePrice * shuttleCount;
      }

      const result = calculatePayment(state.chainEntries, courtFee, shuttlePrice, shuttleCount);
      [result.groups.friends, result.groups.heineken, result.groups.special].forEach((rows) => {
        rows.forEach((row) => {
          const player = row.playerId
            ? state.players.find((item) => Number(item.id) === Number(row.playerId))
            : null;
          row.dualGroup = Boolean(player && player.affiliation === "球友+Hytronik");
          row.hytronikOnly = Boolean(player && player.affiliation === "Hytronik");
        });
      });
      renderPaymentGroup(els.paymentFriends, result.groups.friends, {
        showTotal: true,
        femaleCapApplied: result.femaleCapApplied,
        group: "friends",
      });
      renderPaymentGroup(els.paymentHeineken, result.groups.heineken, {
        showTotal: true,
        femaleCapApplied: result.femaleCapApplied,
        group: "heineken",
      });
      renderPaymentGroup(els.paymentSpecial, result.groups.special, {
        showTotal: false,
        femaleCapApplied: result.femaleCapApplied,
        group: "special",
      });
      els.paymentFriendsCard.hidden = result.groups.friends.length === 0;
      els.paymentHeinekenCard.hidden = result.groups.heineken.length === 0;
      const visibleGroupCount = 1 + Number(!els.paymentFriendsCard.hidden) + Number(!els.paymentHeinekenCard.hidden);
      els.paymentDialog.dataset.groupCount = String(visibleGroupCount);
      els.paymentReport.dataset.groupCount = String(visibleGroupCount);
      renderPaymentCostSummary(
        courtFee,
        courtRows,
        shuttleRows,
        shuttleCost,
        result.payerCount,
        result.femaleCount,
        result.maleCount,
        result.femaleCapApplied
      );
      els.paymentLedgerAmount.textContent = formatMoney(calculateLedgerAmount(result.groups, courtFee));
      const reportDate = state.pendingSessionEdit ? state.pendingSessionEdit.date : getLocalDateString();
      els.paymentReportDate.textContent = formatPaymentDate(reportDate);
      state.currentPaymentRecord = {
        courtFee,
        shuttlePrice,
        shuttleCount,
        courtCount,
        courtPriceRows: courtRows,
        shuttlePriceRows: shuttleRows,
        players: [...result.groups.friends, ...result.groups.heineken, ...result.groups.special].map((row) => ({
          ...buildSessionParticipantFromPaymentRow(row),
        })),
      };
      openModal("paymentModal");
    }

    function buildSessionParticipantFromPaymentRow(row) {
      const entry = row.playerId
        ? state.chainEntries.find((item) => Number(item.player?.id) === Number(row.playerId))
        : state.chainEntries.find((item) => !item.player && getChainEntryBaseName(item) === row.name);
      const gender = entry?.gender || (row.hasFemale && !row.hasMale ? "女" : row.hasMale && !row.hasFemale ? "男" : "不详");
      const level = entry?.levelText || entry?.player?.level || "不详";
      return {
        playerId: row.playerId || null,
        playerName: row.name || "未知成员",
        slots: Number(row.slots) || 0,
        plusCount: Math.max(0, Number(row.slots) - 1),
        amount: Number(row.amount) || 0,
        isFemale: gender === "女",
        gender,
        level,
      };
    }

    async function copyPaymentScreenshot() {
      if (typeof window.html2canvas !== "function") {
        toast("截图组件加载失败，请刷新页面后重试");
        return;
      }

      const originalText = els.paymentCaptureBtn.textContent;
      els.paymentCaptureBtn.disabled = true;
      els.paymentCaptureBtn.textContent = "正在截图";

      try {
        if (document.fonts?.ready) await document.fonts.ready;
        const blobPromise = window.html2canvas(els.paymentReport, {
          backgroundColor: "#f7faf9",
          logging: false,
          scale: Math.max(2, Math.min(3, window.devicePixelRatio || 1)),
          useCORS: true,
        }).then((canvas) => new Promise((resolve, reject) => {
          canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("生成图片失败")), "image/png");
        }));

        if (navigator.clipboard?.write && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": blobPromise })]);
          toast("群收款截图已复制");
        } else {
          downloadPaymentScreenshot(await blobPromise);
          toast("浏览器不支持复制图片，已改为下载");
        }
      } catch (error) {
        toast(`复制截图失败：${error.message}`);
      } finally {
        els.paymentCaptureBtn.disabled = false;
        els.paymentCaptureBtn.textContent = originalText;
      }
    }

    function downloadPaymentScreenshot(blob) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `群收款-${new Date().toISOString().slice(0, 10)}.png`;
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function openPaymentSettingsModal() {
      if (state.readOnly) {
        toast("当前为只读模式，不能修改群收款设置");
        return;
      }
      state.paymentSettingsEditor = {
        activeTab: "球友",

          getJoinNumbersForEditor(affiliation),
        ])),

            .filter(isSpecialPlayer)

        ),

    function switchPaymentSettingsTab(tab) {
      if (![...PAYMENT_ORDER_AFFILIATIONS, "特殊"].includes(tab)) return;
      state.paymentSettingsEditor.activeTab = tab;
      renderPaymentSettings();
    }

    function renderPaymentSettings() {
      const activeTab = state.paymentSettingsEditor.activeTab;
      const isSpecial = activeTab === "特殊";
      els.paymentSettingsTabs.forEach((tab) => {
        const active = tab.dataset.paymentSettingsTab === activeTab;
        tab.classList.toggle("active", active);
        tab.setAttribute("aria-selected", String(active));
        tab.tabIndex = active ? 0 : -1;
      });
      els.paymentSettingsOrderPanel.hidden = isSpecial;
      els.paymentSettingsSpecialPanel.hidden = !isSpecial;
      if (isSpecial) renderSpecialSettingsList();
      else renderOrderList();
    }

    function getJoinNumbersForEditor(affiliation) {
      const members = state.players.filter((player) => hasPlayerAffiliation(player, affiliation));
      const memberIds = new Set(members.map((player) => Number(player.id)));
      const entries = (state.groupJoinNumbers[affiliation] || [])
        .filter((entry) => memberIds.has(Number(entry.playerId)))
        .map((entry) => ({ playerId: Number(entry.playerId), joinNumber: Number(entry.joinNumber) }));
      const assignedIds = new Set(entries.map((entry) => entry.playerId));
      let nextNumber = entries.reduce((max, entry) => Math.max(max, entry.joinNumber), 0) + 1;
      for (const player of members) {
        const playerId = Number(player.id);
        if (assignedIds.has(playerId)) continue;
        entries.push({ playerId, joinNumber: nextNumber++ });
      }
      return entries.sort(compareJoinNumberEntries);
    }

    function renderOrderList() {
      const affiliation = state.paymentSettingsEditor.activeTab;
      if (!PAYMENT_ORDER_AFFILIATIONS.includes(affiliation)) return;
      const playersById = new Map(state.players.map((player) => [Number(player.id), player]));
      const entries = state.paymentSettingsEditor.joinNumbers[affiliation]
        .filter((entry) => {
          const player = playersById.get(Number(entry.playerId));
          return player && hasPlayerAffiliation(player, affiliation);
        })
        .sort(compareJoinNumberEntries);
      state.paymentSettingsEditor.joinNumbers[affiliation] = entries;
      els.paymentSettingsOrderCount.textContent = `${affiliation}成员 ${entries.length}人`;

      if (!entries.length) {
        const empty = document.createElement("div");
        empty.className = "empty-hint";
        empty.textContent = "暂无成员";
        els.paymentSettingsOrderList.replaceChildren(empty);
        return;
      }

      els.paymentSettingsOrderList.replaceChildren(...entries.map((entry) => createOrderRow(playersById.get(entry.playerId), entry)));
    }

    function createOrderRow(player, entry) {
      const row = document.createElement("div");
      row.className = "order-row";
      row.dataset.playerId = String(player.id);

      const name = document.createElement("span");
      name.className = "order-name";
      name.textContent = firstName(player.name) || player.name || "未命名";
      name.title = player.name || "";

      const numberField = document.createElement("label");
      numberField.className = "join-number-field";
      numberField.append(document.createTextNode("第"));
      const input = document.createElement("input");
      input.className = "join-number-input";
      input.type = "number";
      input.min = "1";
      input.step = "1";
      input.inputMode = "numeric";
      input.value = String(entry.joinNumber);
      input.setAttribute("aria-label", `${name.textContent}的入群序号`);
      input.addEventListener("focus", () => input.select());
      input.addEventListener("change", () => setJoinNumber(player.id, input.value));
      numberField.append(input);

      row.append(name, numberField);
      return row;
    }

    function setJoinNumber(playerId, rawValue) {
      const affiliation = state.paymentSettingsEditor.activeTab;
      if (!PAYMENT_ORDER_AFFILIATIONS.includes(affiliation)) return;
      const joinNumber = Number(rawValue);
      const entries = state.paymentSettingsEditor.joinNumbers[affiliation];
      const current = entries.find((entry) => Number(entry.playerId) === Number(playerId));
      if (!current || !Number.isInteger(joinNumber) || joinNumber <= 0) {
        toast("入群序号需要填写大于0的整数");
        renderOrderList();
        return;
      }
      if (current.joinNumber === joinNumber) return;

      moveJoinNumberWithinEntries(entries, current, joinNumber);
      renderOrderList();
    }

    function moveJoinNumberWithinEntries(entries, current, joinNumber) {
      const occupied = new Set(entries
        .filter((entry) => entry !== current)
        .map((entry) => entry.joinNumber));
      let firstVacancy = joinNumber;
      while (occupied.has(firstVacancy)) firstVacancy += 1;

      entries.forEach((entry) => {
        if (entry !== current && entry.joinNumber >= joinNumber && entry.joinNumber < firstVacancy) {
          entry.joinNumber += 1;
        }
      });
      current.joinNumber = joinNumber;
    }

    function openUnrecordedExitModal() {
      const affiliation = state.paymentSettingsEditor.activeTab;
      if (!PAYMENT_ORDER_AFFILIATIONS.includes(affiliation)) return;
      els.unrecordedExitTitle.textContent = `${affiliation}：未录入成员退群`;

    async function savePaymentSettings({ closeAfterSave = true, unrecordedExit = null, successMessage = "群收款设置已保存" } = {}) {
      if (state.readOnly) {

      } finally {
        els.savePaymentSettingsBtn.disabled = false;
      }

    function calculatePayment(entries, courtFee, shuttlePrice, shuttleCount) {
      const payingEntries = entries.filter(shouldCountForPayment);
      const payerCount = payingEntries.length;
      const femaleCount = payingEntries.filter((entry) => entry.isFemale).length;
      const maleCount = payerCount - femaleCount;
      const totalCost = courtFee + shuttlePrice * shuttleCount;
      const perPerson = ceilOneDecimal(totalCost / Math.max(1, payerCount));
      const femaleCapApplied = femaleCount > 0 && maleCount > 0 && perPerson > FEMALE_PAYMENT_CAP;
      const femalePerPerson = femaleCapApplied ? FEMALE_PAYMENT_CAP : perPerson;
      const malePerPerson = femaleCapApplied
        ? ceilOneDecimal((totalCost - femalePerPerson * femaleCount) / maleCount)
        : perPerson;
      const groups = { friends: new Map(), heineken: new Map(), special: new Map() };
      const sharedPaymentGroup = getSharedPaymentGroup(entries);
      let sequence = 0;

      for (const entry of entries) {
        const player = entry.player;
        const canonicalName = player ? paymentDisplayName(player) : getChainEntryBaseName(entry);
        if (!entry.clean) continue;

        if (isSpecialPlayer(player) && player.participatesPayment === false) {
          addPaymentLine(groups.special, canonicalName, 0, "不参与A钱", 0, player.id, sequence++, entry.isFemale);
          continue;
        }
        if (!shouldCountForPayment(entry)) continue;

        const groupName = getPaymentGroup(player, sharedPaymentGroup);
        const entryAmount = entry.isFemale ? femalePerPerson : malePerPerson;
        addPaymentLine(groups[groupName], canonicalName, entryAmount, null, 1, player?.id || null, sequence++, entry.isFemale);
      }

      return {
        payerCount,
        perPerson,
        femaleCount,
        maleCount,
        femalePerPerson,
        malePerPerson,
        femaleCapApplied,
        groups: {
          friends: mapToPaymentRows(groups.friends, PAYMENT_GROUPS.friends),
          heineken: mapToPaymentRows(groups.heineken, PAYMENT_GROUPS.heineken),
          special: mapToPaymentRows(groups.special),
        },
      };
    }

    function calculateLedgerAmount(groups, courtFee) {
      const collectedFromOthers = Object.values(groups)
        .flat()
        .filter((row) => !isChoiPaymentRow(row))
        .reduce((sum, row) => sum + Number(row.amount || 0), 0);
      return collectedFromOthers - courtFee;
    }

    function isChoiPaymentRow(row) {
      const player = row?.playerId
        ? state.players.find((item) => Number(item.id) === Number(row.playerId))
        : null;
      if (player && splitAliases(player.name).some((alias) => normalizeAlias(alias) === "choi")) return true;
      return normalizeAlias(row?.name) === "choi";
    }

    function shouldCountForPayment(entry) {
      if (!entry.clean) return false;
      if (isSpecialPlayer(entry.player) && entry.player.participatesPayment === false) return false;
      return true;
    }

    function getSharedPaymentGroup(entries) {
      const groupableEntries = entries.filter((entry) => shouldCountForPayment(entry) && !isSpecialPlayer(entry.player));
      if (!groupableEntries.length) return null;
      if (groupableEntries.every((entry) => canEntryUsePaymentGroup(entry, "heineken"))) return "heineken";
      if (groupableEntries.every((entry) => canEntryUsePaymentGroup(entry, "friends"))) return "friends";
      return null;
    }

    function canEntryUsePaymentGroup(entry, groupName) {
      if (!entry.player) return groupName === "friends";
      return hasPlayerAffiliation(entry.player, PAYMENT_GROUPS[groupName]);
    }

    function getPaymentGroup(player, sharedPaymentGroup) {
      if (isSpecialPlayer(player)) return "special";
      const override = player?.id ? state.paymentGroupOverrides[Number(player.id)] : null;
      if (override === "球友") return "friends";
      if (override === "Hytronik") return "heineken";
      if (override === "特殊") return "special";
      if (sharedPaymentGroup) return sharedPaymentGroup;
      if (hasPlayerAffiliation(player, "Hytronik")) return "heineken";
      return "friends";
    }

    function addPaymentLine(map, name, amount, note, slots, playerId, sequence, isFemale = false) {
      const key = playerId ? `player:${playerId}` : `name:${name}`;
      const current = map.get(key) || {
        name,
        amount: 0,
        note: null,
        slots: 0,
        playerId: playerId || null,
        sequence,
        hasFemale: false,
        hasMale: false,
        femaleSlots: 0,
        maleSlots: 0,
      };
      current.amount += amount;
      current.slots += slots;
      current.hasFemale = current.hasFemale || isFemale;
      current.hasMale = current.hasMale || !isFemale;
      current.femaleSlots += isFemale ? slots : 0;
      current.maleSlots += isFemale ? 0 : slots;
      if (note) current.note = note;
      if (playerId && !current.playerId) current.playerId = playerId;
      current.sequence = Math.min(current.sequence, sequence);
      map.set(key, current);
    }

    function mapToPaymentRows(map, affiliation) {
      const rows = [...map.values()];
      if (!affiliation) return rows.sort((a, b) => collator.compare(a.name, b.name));

      const orderMap = new Map((state.paymentOrders[affiliation] || []).map((id, index) => [Number(id), index]));
      const chainOrder = state.paymentSortModes[affiliation] === "chain";
      return rows.sort((a, b) => {
        if (chainOrder && a.sequence !== b.sequence) return a.sequence - b.sequence;
        const aOrder = a.playerId && orderMap.has(Number(a.playerId)) ? orderMap.get(Number(a.playerId)) : Number.MAX_SAFE_INTEGER;
        const bOrder = b.playerId && orderMap.has(Number(b.playerId)) ? orderMap.get(Number(b.playerId)) : Number.MAX_SAFE_INTEGER;
        if (aOrder !== bOrder) return aOrder - bOrder;
        return (a.sequence - b.sequence) || collator.compare(a.name, b.name);
      });
    }

    function formatPaymentGroup(rows, showTotal) {
      if (!rows.length) return "";
      const lines = rows.map((row) => `${paymentRowDisplayName(row)}：${formatMoney(row.amount)}`);
      if (showTotal) lines.push(`总计：${formatMoney(rows.reduce((sum, row) => sum + row.amount, 0))}`);
      return lines.join("\n");
    }

    function formatSpecialGroup(rows) {
      if (!rows.length) return "";
      return rows.map((row) => row.note
        ? `${paymentRowDisplayName(row)}：${row.note}`
        : `${paymentRowDisplayName(row)}：${formatMoney(row.amount)}`).join("\n");
    }

    function renderPaymentGroup(container, rows, { showTotal, femaleCapApplied, group = "" }) {
      const elements = rows.map((row) => {
        const highlights = getPaymentRowHighlights(row, femaleCapApplied);
        const line = document.createElement("div");
        line.className = "payment-line";
        line.classList.toggle("companion-highlight", highlights.companion);
        line.classList.toggle("female-cap-highlight", highlights.femaleCap);

        const main = document.createElement("span");
        main.className = "payment-line-main";
        main.textContent = row.note
          ? `${paymentRowDisplayName(row)}：${row.note}`
          : `${paymentRowDisplayName(row)}：${formatMoney(row.amount)}`;
        line.append(main);

        if (row.playerId && (row.dualGroup || row.hytronikOnly)) {
          let currentLabel;
          let nextLabel;
          let kind;
          if (row.dualGroup) {
            kind = "dual";
            currentLabel = group === "friends" ? "球友" : "Hytronik";
            nextLabel = group === "friends" ? "Hytronik" : "球友";
          } else {
            kind = "hytronik";
            currentLabel = group === "special" ? "特殊" : "Hytronik";
            nextLabel = group === "special" ? "Hytronik" : "特殊";
          }
          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "payment-group-toggle";
          toggle.textContent = "◀▶";
          toggle.title = `当前${currentLabel}，点击切换到${nextLabel}`;
          toggle.setAttribute("aria-label", `把${paymentRowDisplayName(row)}切换到${nextLabel}`);
          toggle.setAttribute("data-html2canvas-ignore", "true");
          toggle.addEventListener("click", () => togglePaymentGroup(row.playerId, group, kind));
          line.append(toggle);
        }

        if (highlights.companion || highlights.femaleCap) {
          const badges = document.createElement("span");
          badges.className = "payment-line-badges";
          if (highlights.companion) badges.append(createPaymentBadge(formatPaymentComposition(row), "companion"));
          if (highlights.femaleCap) badges.append(createPaymentBadge("25封顶", "female-cap"));
          line.append(badges);
        }
        return line;
      });

      if (showTotal && rows.length) {
        const total = document.createElement("div");
        total.className = "payment-total-line";
        total.textContent = `总计：${formatMoney(rows.reduce((sum, row) => sum + row.amount, 0))}`;
        elements.push(total);
      }
      container.replaceChildren(...elements);
    }

    function createPaymentBadge(text, type) {
      const badge = document.createElement("span");
      badge.className = `payment-line-badge ${type}`;
      badge.textContent = text;
      return badge;
    }

    function getPaymentRowHighlights(row, femaleCapApplied) {
      return {
        companion: Number(row?.slots) > 1,
        femaleCap: Boolean(femaleCapApplied && row?.slots > 0 && row?.hasFemale && !row?.hasMale),
      };
    }

    function formatPaymentComposition(row) {
      const maleSlots = Number(row?.maleSlots) || 0;
      const femaleSlots = Number(row?.femaleSlots) || 0;
      return [
        maleSlots > 0 ? `🍀x${maleSlots}` : "",
        femaleSlots > 0 ? `🌸x${femaleSlots}` : "",
      ].filter(Boolean).join("，");
    }

    function paymentRowDisplayName(row) {
      const name = String(row?.name || "");
      if (!row?.hasFemale || row?.hasMale || name.includes("🌸")) return name;
      return `${name}🌸`;
    }

    function buildAliasIndex() {
      return state.players.flatMap((player) => splitAliases(player.name).map((alias) => ({
        alias,
        normalized: normalizeAlias(alias),
        player,
      }))).filter((item) => item.normalized).sort((a, b) => b.normalized.length - a.normalized.length);
    }

    function findPlayerForLine(line, aliasIndex) {
      const normalized = normalizeAlias(removeChainAnnotations(line));
      const match = aliasIndex.find((item) => normalized.includes(item.normalized));
      return match?.player || null;
    }

    function removeChainAnnotations(value) {
      return String(value || "").replace(/\([^)]*\)|（[^）]*）/g, " ");
    }

    function splitAliases(name) {
      return String(name || "").split(/[,，]/).map((part) => part.trim()).filter(Boolean);
    }

    function firstName(name) {
      return splitAliases(name)[0] || "";
    }

    function paymentDisplayName(player) {
      return firstName(player.name);
    }

    async function pasteChainInput() {

        els.chainInput.value = await navigator.clipboard.readText();

    }

    function closeModal(id) {

    function closeTopModal() {

    function isAnyModalOpen() {

    function toast(message) {

      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => els.toast.classList.remove("show"), 2600);

    function cleanChainLine(line) {
      return String(line || "").replace(CHAIN_NUMBER_PREFIX, "").trim();
    }

    function getChainInputLines(rawInput) {
      const lines = String(rawInput || "").split(/\r?\n/);
      const numberedLines = lines.filter((line) => CHAIN_NUMBER_PREFIX.test(line));
      return numberedLines.length ? numberedLines : lines;
    }

    function normalizeAlias(value) {
      return String(value || "").normalize("NFKC").toLowerCase().replace(/\s+/g, "");
    }

    function normalizeSearch(value) {
      return String(value || "").normalize("NFKC").toLowerCase();
    }

    function levelRank(level) {
      if (!level || level === "不详" || level === "等级不详") return -1;
      const number = Number.parseFloat(String(level).replace("级", ""));
      return Number.isFinite(number) ? number : -1;
    }

    function ceilOneDecimal(value) {
      return Math.ceil((value + Number.EPSILON) * 10) / 10;
    }

    function formatMoney(value) {
      return (Math.round(value * 10) / 10).toFixed(1);
    }

    function formatCompactNumber(value) {
      return String(Math.round((value + Number.EPSILON) * 100) / 100);
    }

    function isPrintableKey(event) {
      return event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey;
    }

    function isTextControl(element) {
      if (!element) return false;
      const tag = element.tagName;
      return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || element.isContentEditable;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[char]));
    }

    function escapeXml(value) {
      return String(value).replace(/[&<>"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[char]));
    }

    function cssEscape(value) {
      return String(value).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    }

    function columnLetter(index) {
      let letter = "";
      while (index > 0) {
        const mod = (index - 1) % 26;
        letter = String.fromCharCode(65 + mod) + letter;
        index = Math.floor((index - mod) / 26);
      }
      return letter;
    }

    function getDosTimeDate(date) {
      const dosTime = (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2);
      const dosDate = ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
      return { dosTime, dosDate };
    }

    function concatUint8(parts) {
      const total = parts.reduce((sum, part) => sum + part.length, 0);
      const output = new Uint8Array(total);
      let offset = 0;
      for (const part of parts) {
        output.set(part, offset);
        offset += part.length;
      }
      return output;
    }

    let crcTable;
    function crc32(data) {
      if (!crcTable) {
        crcTable = new Uint32Array(256);
        for (let i = 0; i < 256; i++) {
          let c = i;
          for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
          crcTable[i] = c >>> 0;
        }
      }
      let crc = 0xffffffff;
      for (const byte of data) crc = crcTable[(crc ^ byte) & 0xff] ^ (crc >>> 8);
      return (crc ^ 0xffffffff) >>> 0;
    }

    init();
  </script>
