name = "badminton"
main = "src/worker.js"
compatibility_date = "2026-07-09"

[triggers]
crons = ["5 4 * * *"]

[ai]
binding = "AI"

[[ratelimits]]
name = "MEMBER_EXIT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "GROUP_ATTEMPT_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.txt"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "Badminton"
database_id = "9bcf9305-121d-423a-a87a-d225aa2bf5cc"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "badminton-photos"
