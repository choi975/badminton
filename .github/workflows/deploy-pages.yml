name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify deployed Cloudflare activity-date drafts
        run: node scripts/verify-deployed-chain-date.js

      - name: Verify deployed Cloudflare calendar statistics
        run: node scripts/verify-deployed-calendar-statistics.js

      - name: Verify deployed Cloudflare member statistics
        run: node scripts/verify-deployed-member-statistics.js

      - name: Verify deployed Cloudflare roster review
        run: node scripts/verify-deployed-roster-review.js

      - name: Verify deployed Cloudflare shuttle-price editing
        run: node scripts/verify-deployed-shuttle-types.js

      - name: Verify deployed Cloudflare hourly fees
        run: node scripts/verify-deployed-hourly-fees.js

      - name: Build static site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed GitHub Pages assets
        run: node scripts/verify-deployed-pages.js
